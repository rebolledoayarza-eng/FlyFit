<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E2D69">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlyFit</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlyFit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (el fondo de la app se mantiene: #EEF3FA / #0A1222) ===== */
:root{
  --bg:#EEF3FA; --card:#FFFFFF; --card2:#F5F8FD; --ink:#0F1F3D; --text:#3A4763; --muted:#76839B; --line:#E3E9F2; --line2:#D0D9E7;
  --navy:#0E2D69; --navy2:#173F8A; --blue:#1B5FD6; --blue-soft:#E7EFFC; --on-blue:#FFFFFF;
  --fly:#5A4FCF; --fly-soft:#EDEBFB;
  --ex:#13895A; --ex-soft:#E2F3EA;
  --sleep:#2F4F9E; --sleep-soft:#E4EAF6; --nap:#8AA2DA;
  --rest:#3A78D8; --rest-soft:#E5EEFB;
  --teal:#13897C; --off:#13895A; --away:#0E7D90; --res:#C2740E; --ground:#5B7083; --none:#A3ADBD; --warn:#C8432B; --flame:#E0701A;
  --ok:#13895A; --mid:#C2740E;
  --sh:0 1px 2px rgba(16,40,90,.05),0 6px 18px rgba(16,40,90,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1222; --card:#111B2E; --card2:#16223A; --ink:#EEF3FC; --text:#C4CEE0; --muted:#8693AB; --line:#1F2B44; --line2:#2C3B58;
  --navy:#0B1F4A; --navy2:#15367A; --blue:#5B95F5; --blue-soft:#16294A; --on-blue:#FFFFFF;
  --fly:#9A8FF2; --fly-soft:#221F45; --ex:#3BC27A; --ex-soft:#12301F; --sleep:#7D9BE6; --sleep-soft:#18264A; --nap:#4D6299;
  --rest:#6AA6F2; --rest-soft:#14294A; --teal:#35C2B1; --off:#3BC27A; --away:#3CC0D1; --res:#F0A040; --ground:#9FB0C4; --none:#5E6A80; --warn:#FF6B4E;
  --ok:#3BC27A; --mid:#F0A040; --sh:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A1222; --card:#111B2E; --card2:#16223A; --ink:#EEF3FC; --text:#C4CEE0; --muted:#8693AB; --line:#1F2B44; --line2:#2C3B58;
  --navy:#0B1F4A; --navy2:#15367A; --blue:#5B95F5; --blue-soft:#16294A; --on-blue:#FFFFFF;
  --fly:#9A8FF2; --fly-soft:#221F45; --ex:#3BC27A; --ex-soft:#12301F; --sleep:#7D9BE6; --sleep-soft:#18264A; --nap:#4D6299;
  --rest:#6AA6F2; --rest-soft:#14294A; --teal:#35C2B1; --off:#3BC27A; --away:#3CC0D1; --res:#F0A040; --ground:#9FB0C4; --none:#5E6A80; --warn:#FF6B4E;
  --ok:#3BC27A; --mid:#F0A040; --sh:none; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.45 "Inter","Helvetica Neue","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body[data-v="inicio"]::before{background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{color:var(--ink);margin:0}
.app{max-width:520px;margin:0 auto;padding:0 0 calc(96px + env(safe-area-inset-bottom,0px))}
#view{min-height:60vh}
.ovl{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Barra superior */
.bar{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.bar h1{font-size:1.25rem;font-weight:700;letter-spacing:-.015em;flex:1}
.backb,.iconb{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);flex:none}
.backb svg,.iconb svg{width:18px;height:18px}
.iconb:disabled{opacity:.35;cursor:default}
.bar .act{border:0;background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:.82rem;padding:7px 12px;border-radius:8px}

/* Cabecera de Hoy */
.hdr{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:14px 18px 18px;border-radius:0 0 22px 22px}
.hrow{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.mark svg{width:19px;height:19px;color:#fff}
.hb b{display:block;font-weight:700;font-size:1rem;letter-spacing:-.01em;line-height:1.15}
.hb small{display:block;font-size:.68rem;opacity:.7;letter-spacing:.03em}
.hbtn{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center}
.hbtn svg{width:18px;height:18px}
.hdate{margin-top:18px}
.hdate span{font-size:.78rem;opacity:.75;font-weight:500}
.hdate h1{color:#fff;font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.live{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:.82rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:9px 12px;border-radius:10px;line-height:1.4}
.live i{width:8px;height:8px;border-radius:50%;background:#9FC2FF;margin-top:5px;flex:none}
.live.on i{background:#7CF0A8;box-shadow:0 0 0 4px rgba(124,240,168,.22)}
.live b{font-weight:700}
.hk{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.hk div{padding:0 10px;border-left:1px solid rgba(255,255,255,.14);min-width:0}
.hk div:first-child{padding-left:0;border-left:0}
.hk small{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;opacity:.7;font-weight:700}
.hk b{display:block;font-size:1rem;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk span{display:block;font-size:.72rem;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 14px 0;box-shadow:var(--sh)}
.card h3{font-size:1rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-size:.74rem;color:var(--muted);font-weight:600}
.chd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.chd small{font-size:.74rem;color:var(--muted);font-weight:500;text-align:right}
.chd .lnk{border:0;background:transparent;color:var(--blue);font-weight:600;font-size:.8rem;padding:0;display:inline-flex;align-items:center;gap:2px}
.chd .lnk svg{width:14px;height:14px}
.sec{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 18px 0;display:flex;justify-content:space-between;align-items:center}
.sec small{letter-spacing:0;text-transform:none}
.lead{color:var(--text);font-size:.86rem;margin:4px 0 0}
.note{color:var(--text);font-size:.83rem;margin:10px 0 0}
.empty{color:var(--muted);font-size:.86rem;margin:10px 0 0}
.warn{color:var(--warn);font-size:.84rem;font-weight:600;margin:8px 0 0}
.btn{border:0;background:var(--blue);color:var(--on-blue);font-weight:600;padding:11px 16px;border-radius:10px;font-size:.9rem}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.block{width:100%;display:block}
.btn.big{padding:13px 18px;font-size:.98rem}
.btn.sm{padding:8px 12px;font-size:.82rem}
.row{display:flex;gap:10px;align-items:flex-end;margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:.76rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink)}
textarea{min-height:84px;resize:vertical;margin-top:8px}
.saved{font-size:.76rem;color:var(--ex);font-weight:600;min-height:1em;margin-top:4px}
.rowlink{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px;margin-top:12px;text-align:left}
.rowlink .tx{flex:1;min-width:0}
.rowlink b{display:block;color:var(--ink);font-size:.9rem}
.rowlink small{color:var(--muted);font-size:.78rem}
.rowlink .chev{color:var(--muted)}
.chev svg{width:16px;height:16px;display:block}
.play{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:13px;height:13px}
.autotag{display:inline-block;margin-top:10px;font-size:.74rem;font-weight:600;color:var(--res);background:color-mix(in srgb,var(--res) 12%,var(--card));padding:4px 9px;border-radius:6px}
.tipline{margin:12px 0 0;font-size:.84rem;color:var(--text);background:var(--card2);border-radius:10px;padding:10px 12px;border-left:3px solid var(--blue)}
.linkish{border:0;background:transparent;color:var(--blue);font-weight:600;font-size:.84rem;padding:6px 0 0;text-align:left;display:block}

/* Íconos */
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.ic svg{width:19px;height:19px}
.ic.fly{background:var(--fly-soft);color:var(--fly)}
.ic.ex{background:var(--ex-soft);color:var(--ex)}
.ic.rest{background:var(--rest-soft);color:var(--rest)}
.ic.sl{background:var(--sleep-soft);color:var(--sleep)}
.ic.res{background:color-mix(in srgb,var(--res) 14%,var(--card));color:var(--res)}
.ic.away{background:color-mix(in srgb,var(--away) 14%,var(--card));color:var(--away)}
.ic.blue{background:var(--blue-soft);color:var(--blue)}

/* Etiquetas */
.pill{display:inline-flex;align-items:center;font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;color:var(--t);background:color-mix(in srgb,var(--t) 13%,transparent);white-space:nowrap;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.73rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--text);border:1px solid var(--line);white-space:nowrap}
.chip svg{width:13px;height:13px;flex:none}
.chip.ex{color:var(--ex)} .chip.ex.on{background:var(--ex-soft);border-color:transparent}
.chip.sl{color:var(--sleep)} .chip.rest{color:var(--rest)} .chip.miss{color:var(--warn)}
.bdg{font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:5px;white-space:nowrap;align-self:start}
.bdg.fly{background:var(--fly-soft);color:var(--fly)}
.bdg.ex{background:var(--ex-soft);color:var(--ex)}
.bdg.rest{background:var(--rest-soft);color:var(--rest)}
.bdg.done{background:var(--ex);color:#fff}
.bdg.miss{background:color-mix(in srgb,var(--warn) 12%,var(--card));color:var(--warn)}

/* Línea de tiempo de 24 h */
.tl{position:relative;display:block;height:26px;border-radius:7px;background-color:var(--card2);border:1px solid var(--line);overflow:hidden;
  background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%)}
.tl .sg{position:absolute;top:3px;bottom:3px;border-radius:4px;display:block;min-width:2px}
.sg.sleep{background:var(--sleep)} .sg.nap{background:var(--nap)} .sg.duty{background:var(--fly)} .sg.train{background:var(--ex)} .sg.act{background:var(--ground)}
.tl .nowm{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--warn);display:block}
.tl.mini{height:12px;border-radius:4px}
.tl.mini .sg{top:2px;bottom:2px;border-radius:2px}
.tlx{display:flex;justify-content:space-between;font-size:.64rem;color:var(--muted);margin-top:4px;font-weight:600}
.tleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.72rem;color:var(--text);margin-top:10px}
.tleg span{display:inline-flex;align-items:center;gap:6px}
.tleg i{width:10px;height:10px;border-radius:3px;background:var(--c)}

/* Agenda del día */
.ag{list-style:none;margin:14px 0 0;padding:0}
.ag li{display:grid;grid-template-columns:50px 28px 1fr;gap:0 10px;align-items:start;position:relative;padding-bottom:14px}
.ag li::before{content:"";position:absolute;left:73px;top:30px;bottom:2px;width:2px;background:var(--line)}
.ag li:last-child{padding-bottom:0}
.ag li:last-child::before{display:none}
.ag time{font-weight:700;color:var(--ink);font-size:.86rem;padding-top:4px;text-align:right;white-space:nowrap}
.ag time small{display:block;font-weight:500;color:var(--muted);font-size:.7rem}
.ag .dot{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c)}
.ag .dot svg{width:15px;height:15px}
.ag b{display:block;color:var(--ink);font-size:.88rem;font-weight:600;padding-top:4px}
.ag p{margin:1px 0 0;font-size:.79rem;color:var(--muted)}

/* Recuperación */
.rdy{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .tr{stroke:var(--line)} .ring .va{stroke:var(--c);transition:stroke-dashoffset .4s}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:1.45rem;font-weight:800;color:var(--ink);line-height:1}
.ring small{font-size:.6rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-top:2px}
.rlv{font-weight:700;color:var(--c);font-size:1rem}
.facts{list-style:none;margin:4px 0 0;padding:0;font-size:.79rem;color:var(--text)}
.facts li{display:flex;gap:7px;align-items:baseline;padding:2px 0}
.facts li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line2);flex:none;transform:translateY(-2px)}
.rec{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--c) 8%,var(--card));border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));font-size:.83rem;color:var(--ink)}
.rec > svg{width:17px;height:17px;color:var(--c);flex:none;margin-top:1px}

/* Próximos días (diagrama) */
.gt{list-style:none;margin:4px 0 0;padding:0}
.gt li button{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:8px 0;text-align:left;border-top:1px solid var(--line)}
.gt li:first-child button{border-top:0}
.gl{display:flex;flex-direction:column}
.gl small{font-size:.62rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.gl b{font-size:1rem;color:var(--ink);line-height:1.15}
.gt .now .gl b,.gt .now .gl small{color:var(--blue)}
.gm{display:flex;flex-direction:column;gap:5px;min-width:0}
.gs{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.74rem;color:var(--text);min-width:0}
.gs > span:first-child{display:flex;gap:6px;align-items:center;white-space:nowrap}
.gx{font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gx.ex{color:var(--ex)} .gx.sl{color:var(--sleep)}

/* Agenda semanal */
.roster{list-style:none;margin:10px 14px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:44px 1fr;gap:12px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;box-shadow:var(--sh)}
.drow.now{border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.dc{display:flex;flex-direction:column;align-items:center;padding-top:2px}
.dc small{font-size:.62rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.dc b{font-size:1.25rem;color:var(--ink);font-weight:700;line-height:1.15}
.drow.now .dc small,.drow.now .dc b{color:var(--blue)}
.dm{display:flex;flex-direction:column;gap:6px;min-width:0}
.dh{display:flex;align-items:center;gap:8px;min-width:0}
.dh b{color:var(--ink);font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm > small{font-size:.78rem;color:var(--text)}

/* Detalle del día y vuelo */
.dtitle{font-size:1.1rem;font-weight:700;margin:2px 18px 0;letter-spacing:-.01em}
.ops .route{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:4px 0 2px}
.route span{display:flex;flex-direction:column}
.route b{font-size:1.35rem;font-weight:800;color:var(--ink);letter-spacing:.02em;line-height:1.1}
.route small{font-size:.66rem;color:var(--muted);font-weight:500}
.route i{color:var(--muted);display:grid;place-items:center;margin-bottom:12px}
.route i svg{width:14px;height:14px}
.opsg,.opsr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.opsg small,.opsr small{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.opsg b{display:block;color:var(--ink);font-size:1.05rem;font-weight:700;margin-top:2px}
.opsr b{display:block;color:var(--ink);font-size:.84rem;font-weight:600;margin-top:2px}
.opsr b.bad{color:var(--warn)} .opsr b.mid{color:var(--mid)} .opsr b.good{color:var(--ok)}
.legs{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.legs li{font-size:.74rem;font-weight:600;background:var(--fly-soft);color:var(--fly);padding:3px 8px;border-radius:6px}
.kcard{margin:12px 14px 0;border-radius:14px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--t);box-shadow:var(--sh)}
.kcard b{color:var(--ink);font-size:.95rem}
.kcard p{margin:4px 0 0;font-size:.86rem}
.pch{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.pch b{display:block;color:var(--ink);font-size:.98rem}
.pch small{color:var(--muted);font-size:.78rem}
.winrow{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--ex-soft);color:var(--ink);font-size:.84rem}
.winrow svg{width:18px;height:18px;color:var(--ex);flex:none}
.winrow.no{background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.winrow.no svg{color:var(--warn)}

/* Descanso */
.sp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.sp small{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.sp b{display:block;font-size:1.5rem;font-weight:800;color:var(--ink);line-height:1.15}
.sp > div:last-child{text-align:right}
.spl{display:flex;align-items:center;gap:6px;color:var(--sleep);font-size:.78rem;font-weight:700;white-space:nowrap}
.spl svg{width:15px;height:15px;flex:none}
.spl i{flex:1;height:2px;background:color-mix(in srgb,var(--sleep) 35%,transparent);border-radius:2px;min-width:8px}
.gaps{list-style:none;margin:4px 0 0;padding:0}
.gaps li{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:.83rem}
.gaps li:first-child{border-top:0}
.gaps .gd{font-weight:700;color:var(--ink)}
.gaps span{color:var(--text)}
.gaps b{font-weight:700;color:var(--ok);white-space:nowrap}
.gaps b.bad{color:var(--warn)} .gaps b.mid{color:var(--mid)}
.seg5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg5 button{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg5 b{font-size:1rem;color:var(--ink)}
.seg5 small{font-size:.62rem;color:var(--muted);font-weight:600}
.seg5 [aria-pressed="true"]{border-color:var(--sleep);background:var(--sleep-soft)}
.seg5 [aria-pressed="true"] b,.seg5 [aria-pressed="true"] small{color:var(--sleep)}
.tips{margin:6px 0 0;padding-left:18px;font-size:.84rem}
.tips li{margin:5px 0}
.hm{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hm small{display:block;font-size:.66rem;color:var(--muted);font-weight:600}
.hm b{display:block;font-size:.86rem;color:var(--ink);font-weight:700;margin:2px 0 6px;white-space:nowrap}

/* Entrenamiento */
.pbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .4s}
.pcap{font-size:.74rem;color:var(--muted);font-weight:600;margin:6px 0 0}
.circles{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;text-align:center}
.circles button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0}
.circles span{font-size:.7rem;font-weight:700;color:var(--muted);width:24px;height:20px;display:grid;place-items:center;border-radius:5px}
.circles .sel span{background:var(--blue-soft);color:var(--blue)}
.cir{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--muted);background:var(--card)}
.cir svg{width:17px;height:17px}
.cir.done{background:var(--ex);border-color:var(--ex);color:#fff}
.cir.fly{background:var(--fly);border-color:var(--fly);color:#fff}
.cir.flyr{border-color:var(--fly);color:var(--fly)}
.cir.rest{background:var(--rest-soft);border-color:var(--rest-soft);color:var(--rest)}
.cir.miss{border-color:var(--warn);color:var(--warn);font-weight:700}
.cir.today{box-shadow:0 0 0 3px var(--blue-soft);border-color:var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:.72rem;color:var(--text)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.chk{list-style:none;margin:10px 0 0;padding:0}
.chk li{border-top:1px solid var(--line)}
.chk li:first-child{border-top:0}
.chk button{display:flex;gap:12px;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;padding:11px 0}
.chk .bx{width:20px;height:20px;border-radius:5px;border:1.6px solid var(--line2);flex:none;display:grid;place-items:center;color:transparent;margin-top:1px;transition:background .15s}
.chk .bx svg{width:13px;height:13px}
.chk [aria-pressed="true"] .bx{background:var(--blue);border-color:var(--blue);color:#fff}
.chk [aria-pressed="true"] b{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.chk b{display:block;color:var(--ink);font-weight:600;font-size:.9rem}
.chk small{display:block;color:var(--muted);font-size:.77rem;margin-top:1px}
.rtitle{margin:2px 18px 0}
.rtitle h2{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.rtitle p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
.exl{list-style:none;margin:2px 0 0;padding:0}
.exr{display:grid;grid-template-columns:38px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.exr:first-child{border-top:0}
.gly{width:38px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.gly svg{width:22px;height:22px}
.exi b{display:block;color:var(--ink);font-size:.92rem;font-weight:600}
.exi .cr{display:block;color:var(--muted);font-size:.77rem;margin-top:2px}
.exs{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.vol{font-weight:700;color:var(--ink);font-size:.9rem;white-space:nowrap}
.vol small{display:block;text-align:right;color:var(--muted);font-weight:500;font-size:.72rem}
.exck{width:30px;height:30px;border-radius:8px;border:1.6px solid var(--line2);background:var(--card);display:grid;place-items:center;color:transparent;padding:0}
.exck svg{width:15px;height:15px}
.exck[aria-pressed="true"]{background:var(--ex);border-color:var(--ex);color:#fff}
.exr.done .exi b{color:var(--muted)}
.kgs{display:inline-flex;align-items:center;margin-top:8px;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.kgs button{border:0;background:var(--card2);width:34px;height:34px;font-weight:700;color:var(--blue)}
.kgs input{width:62px;border:0;border-radius:0;text-align:center;padding:6px 4px;font-weight:600}
.kgs::after{content:"kg";font-size:.74rem;color:var(--muted);padding:0 8px 0 2px}
.wlist{margin:8px 0 0;padding-left:18px;font-size:.85rem}
.wlist li{margin:4px 0}
.tipbox{display:flex;gap:10px;margin:12px 14px 0;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;padding:12px 14px;font-size:.84rem;color:var(--text)}
.tipbox svg{width:20px;height:20px;color:var(--blue);flex:none}
.tipbox p{margin:0}
.tipbox p+p{margin-top:6px}
.crono{display:flex;flex-direction:column;gap:12px;align-items:stretch;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:4px;text-align:center}
.cdisp span{display:block;font-size:2.6rem;font-weight:800;color:var(--ink);line-height:1.1}
.cdisp small{color:var(--muted);font-size:.8rem}
.crono.rest .cdisp span{color:var(--rest)}
.crono.run .cdisp span{color:var(--blue)}
.cbtns{display:flex;gap:8px;justify-content:center}
.cbtns .btn{flex:1}
.laps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.lap{display:flex;flex-direction:column;align-items:center;gap:4px}
.lap label{font-size:.7rem;color:var(--muted);font-weight:700}
.lap input{text-align:center;padding:8px 2px;font-size:15px}
.lap.set input{border-color:var(--ex)}
.lap small{font-size:.7rem;font-weight:700}
.lap small.up{color:var(--ex)} .lap small.dn{color:var(--warn)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px;background:var(--card2);border:1px solid var(--line);padding:3px;border-radius:10px}
.seg button{border:0;background:transparent;border-radius:8px;padding:9px 4px;font-weight:600;font-size:.83rem;color:var(--text)}
.seg [aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(16,40,90,.12)}
.seg [data-v="hecha"][aria-pressed="true"]{background:var(--ex);color:#fff}
.seg [data-v="saltada"][aria-pressed="true"]{color:var(--warn)}
.fblock{margin-top:16px}
.flab{display:flex;justify-content:space-between;align-items:baseline;font-size:.83rem;font-weight:600;color:var(--ink);margin-bottom:8px}
.flab b{font-weight:600;color:var(--muted);font-size:.8rem}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.83rem}
.dchip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.dmin{width:76px!important;padding:7px 10px!important;border-radius:8px!important}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{border:1px solid var(--line2);background:var(--card);border-radius:7px;padding:8px 0;font-weight:700;font-size:.83rem}
.rpe [aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.fld.over{margin-top:16px}
.over select{margin-top:2px}

/* Nutrición */
.dnav{display:flex;align-items:center;justify-content:space-between;margin:0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.dnav .iconb{border:0;background:transparent}
.dnav b{color:var(--ink);font-size:.9rem}
.goal{display:flex;gap:14px;align-items:flex-start}
.goal small{color:var(--muted);font-size:.78rem;display:block}
.goal b{display:block;color:var(--ink);margin:2px 0}
.kc{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center}
.kring{position:relative;width:104px;height:104px}
.kring svg{width:104px;height:104px;transform:rotate(-90deg)}
.kring .tr{stroke:var(--line)} .kring .va{stroke:var(--teal);transition:stroke-dashoffset .4s}
.kring.over .va{stroke:var(--warn)}
.kring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kring b{font-size:1.3rem;font-weight:800;color:var(--ink);line-height:1}
.kring small{font-size:.7rem;color:var(--muted)}
.kgoal{font-size:.82rem;font-weight:700;color:var(--ink);margin-bottom:6px}
.mb{margin-top:8px}
.mbl{display:flex;justify-content:space-between;font-size:.75rem;font-weight:600;color:var(--ink)}
.mbl span:last-child{color:var(--muted);font-weight:500}
.mbt{display:block;height:5px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:4px}
.mbt i{display:block;height:100%;border-radius:999px;background:var(--blue);transition:width .4s}
.mbt .p{background:var(--teal)} .mbt .c{background:var(--blue)} .mbt .g{background:var(--flame)}
.ninp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.meal{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .em{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:var(--card2);border:1px solid var(--line);color:var(--ink)}
.meal b{display:block;color:var(--ink);font-size:.9rem}
.meal small{color:var(--muted);font-size:.78rem}
.mck{width:28px;height:28px;border-radius:8px;border:1.6px solid var(--line2);background:var(--card);display:grid;place-items:center;color:transparent;padding:0}
.mck svg{width:15px;height:15px}
.mck[aria-pressed="true"]{background:var(--ex);border-color:var(--ex);color:#fff}
.meals{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mchip{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 11px;font-weight:600;font-size:.82rem;text-align:left}
.mchip small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.logl{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.logl li{display:flex;align-items:center;gap:4px;background:var(--ex-soft);color:var(--ink);font-size:.8rem;font-weight:600;padding:3px 4px 3px 10px;border-radius:6px}
.logl button{border:0;background:transparent;color:var(--muted);width:22px;height:22px;border-radius:5px}
.hsec{margin-top:16px}
.vasos{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.vaso{height:40px;border:1.5px solid var(--line2);border-radius:5px 5px 10px 10px;background:var(--card);position:relative;overflow:hidden;padding:0}
.vaso i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#6FB4F7,#2F7DE6);transition:height .25s}
.vaso.on{border-color:#2F7DE6}
.vaso.on i{height:82%}
.hint{font-size:.73rem;color:var(--muted);margin:6px 0 0}
.slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--blue) var(--p),var(--line) var(--p));outline-offset:6px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--blue)}
.sticks{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-top:6px}
.sticks .goal{color:var(--ex);font-weight:700;display:inline}
.swrow{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--ink);font-size:.88rem}
.switch{width:48px;height:28px;border-radius:999px;border:0;background:var(--line2);position:relative;padding:0;transition:background .2s;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ex)}
.switch[aria-checked="true"] i{transform:translateX(20px)}

/* Progreso */
.tabsx{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabsx button{border:0;background:transparent;padding:8px 0;font-weight:600;color:var(--muted);font-size:.85rem;border-radius:8px}
.tabsx [aria-pressed="true"]{color:var(--ink);background:var(--card2);box-shadow:inset 0 0 0 1px var(--line)}
.kpis3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--line)}
.kpis3 div{display:flex;flex-direction:column;gap:2px;padding:12px 10px 0;border-left:1px solid var(--line)}
.kpis3 div:first-child{border-left:0;padding-left:0}
.kpis3 small{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.kpis3 b{font-size:1.2rem;color:var(--ink);font-weight:800}
.kpis3 b span{font-size:.74rem;font-weight:600;color:var(--muted)}
.adh{list-style:none;padding:0;margin:4px 0 0}
.adh li{display:grid;grid-template-columns:96px 1fr 56px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.adh li:first-child{border-top:0}
.adh .lb b{display:block;color:var(--ink);font-size:.86rem}
.adh .lb span{color:var(--muted);font-size:.72rem}
.adh .bar2{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.adh .bar2 i{display:block;height:100%;background:var(--ex);border-radius:999px}
.adh .v{text-align:right;font-weight:700;color:var(--ink);font-size:.86rem}
.adh .v span{display:block;font-size:.68rem;color:var(--muted);font-weight:500}
.adh .wnote{grid-column:1/-1;font-size:.8rem;color:var(--text);background:var(--card2);padding:6px 10px;border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi span{display:block;font-size:.62rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-size:1.15rem;color:var(--ink);font-weight:800}
.close-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.chart{width:100%;height:auto;margin-top:12px}
.chart text{fill:var(--muted);font-size:10px;font-family:inherit}
.trend{font-size:.84rem;margin:8px 0 0}
.trend b{color:var(--ink)}
.wstep{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.wstep button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--blue);font-size:1.3rem;font-weight:700}
.wv{display:flex;align-items:baseline;gap:4px;justify-content:center;min-width:110px}
.wv input{width:110px;text-align:center;font-size:1.8rem!important;font-weight:800;border:0!important;background:transparent!important;padding:0!important}
.wv .big{font-size:1.8rem;font-weight:800;color:var(--ink)}
.wv span{color:var(--muted);font-weight:600}
.list{list-style:none;padding:0;margin:12px 0 0}
.list li{display:grid;grid-template-columns:1fr auto 56px 56px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:.85rem}
.list li b{color:var(--ink)}
.list .delta{font-weight:700;font-size:.8rem;text-align:right}
.x{border:0;background:transparent;color:var(--muted);font-size:.76rem;font-weight:600;text-align:right}
.meds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.scroll{overflow-x:auto;margin-top:12px}
.tbl{border-collapse:collapse;width:100%;font-size:.8rem;white-space:nowrap}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--muted);font-weight:600}
.miss{margin:8px 0 0;padding-left:18px;font-size:.85rem}
.done-lbl{display:inline-flex;align-items:center;gap:6px;color:var(--ex);font-weight:700;font-size:.85rem;margin-top:12px}

/* Calendario */
.wnav{display:flex;align-items:center;justify-content:space-between;margin:12px 14px 0}
.wnav div{text-align:center}
.wnav b{display:block;color:var(--ink);font-size:.98rem}
.wnav small{color:var(--muted);font-size:.76rem;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 14px 0}
.mgrid .h{text-align:center;font-size:.66rem;color:var(--muted);font-weight:700;padding:4px 0;letter-spacing:.05em}
.mday{border:1px solid var(--line);border-top:3px solid var(--t);border-radius:8px;background:var(--card);min-height:56px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.mday .n{font-weight:700;color:var(--ink);font-size:.86rem}
.mday .c{font-size:.6rem;font-weight:700;color:var(--t);letter-spacing:.02em}
.mday .mk{width:6px;height:6px;border-radius:2px;border:1.5px solid var(--ex);position:absolute;bottom:5px}
.mday .mk.ok{background:var(--ex)}
.mday.out{opacity:.4}
.mday.today{box-shadow:inset 0 0 0 2px var(--blue)}
.mlegend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:14px 18px 0;font-size:.72rem;color:var(--text)}
.mlegend span{display:flex;align-items:center;gap:6px}
.mlegend i{width:10px;height:10px;border-radius:3px;background:var(--t)}
.calfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 14px 0;font-size:.8rem;color:var(--muted)}

/* Más */
.prof{display:flex;gap:14px;align-items:center}
.prof .ic{width:46px;height:46px;background:var(--navy);color:#fff}
.prof b{display:block;color:var(--ink);font-size:1.02rem}
.prof small{color:var(--muted)}
.menu{list-style:none;padding:0;margin:0}
.menu button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;padding:12px 0;text-align:left;border-top:1px solid var(--line)}
.menu li:first-child button{border-top:0}
.menu .tx{flex:1}
.menu b{display:block;color:var(--ink);font-size:.92rem}
.menu small{color:var(--muted);font-size:.77rem}
.feat{list-style:none;padding:0;margin:8px 0 0}
.feat li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:7px 0;font-size:.85rem}
.feat svg{width:20px;height:20px;color:var(--blue)}
.months{list-style:none;padding:0;margin:8px 0 12px}
.months li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:.86rem;color:var(--ink)}
.months li span{color:var(--muted)}
.months li:first-child{border-top:0}
.rules{margin:10px 0 0;padding-left:18px;font-size:.85rem}
.rules li{margin:5px 0}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mform .fld:first-child{grid-column:1/-1}
.mform .btn{grid-column:1/-1}
.steps{margin:8px 0 0;padding-left:20px;font-size:.86rem}
.sync{display:none;text-align:center;font-size:.74rem;color:var(--muted);margin:16px 18px 0}
body[data-v="mas"] .sync{display:block}

/* Barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabbar div{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:520px}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:600;color:var(--muted);padding:5px 0;border-radius:10px}
.tabbar svg{width:22px;height:22px}
.tabbar [aria-current="page"]{color:var(--blue)}
.tabbar [aria-current="page"] svg{background:var(--blue-soft);border-radius:8px;padding:2px;width:34px;height:26px}

/* Toast, hoja */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.85rem;font-weight:600;display:flex;gap:12px;align-items:center;transition:all .25s;z-index:40;max-width:92vw;width:max-content}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:#8DB5FF;font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(8,18,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-h h3{font-size:1.05rem}
.iconbtn{width:34px;height:34px;border-radius:8px;border:0;background:var(--card2);font-size:1.2rem;color:var(--ink)}
.up{list-style:none;padding:0;margin:10px 0}
.up li{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.85rem}
.up .d{font-weight:700;color:var(--ink)}
.tag{font-size:.7rem;font-weight:700;color:var(--t);background:color-mix(in srgb,var(--t) 13%,transparent);padding:3px 8px;border-radius:5px}
.loading{display:flex;gap:10px;align-items:center;padding:24px 0;color:var(--muted)}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--blue);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function normalize(arr, month){

    if (!["vuelo","blanco","libre","tierra","fuera","act"].includes(x.type)) continue;
    const e = {date:x.date, type:x.type};
    if (x.type==="vuelo"){
      const legs = (Array.isArray(x.legs)?x.legs:[]).map(l => String(l).toUpperCase().replace(/\s/g,"").replace(/[–—>]/g,"-").replace(/-+/g,"-")).filter(l => /^[A-Z]{3}-[A-Z]{3}$/.test(l));
      const r = /^\d{2}:\d{2}$/.test(x.r||"") ? x.r : null;
      if (!legs.length || !r) continue;
      const s = T(x.date, r, off(legs[0].slice(0,3))), de = legs.at(-1).slice(4);
      let en;
      if (/^\d{2}:\d{2}$/.test(x.d||"")){ en = T(x.dNext?addD(x.date,1):x.date, x.d, off(de)); if (en<=s) en = T(addD(x.date,1), x.d, off(de)); e.d = x.d; }
      else { en = new Date(s.getTime()+8*36e5); e.d = "sin dato"; e.est = true; }
      Object.assign(e, {r, legs, s:s.toISOString(), e:en.toISOString()});
    }
    if (x.type==="fuera" && /^[A-Z]{3}$/.test(x.place||"")) e.place = x.place;
    if (x.type==="act"){ if (!/^\d{2}:\d{2}$/.test(x.st||"") || !/^\d{2}:\d{2}$/.test(x.en||"")) continue; e.st = x.st; e.en = x.en; e.code = String(x.code||"ACT").slice(0,8); e.label = /^HSB/.test(e.code) ? "Reserva en casa" : `Actividad en tierra (${e.code})`; e.home = /^HSB/.test(e.code); }

  if (late) f.push(`${late} ${late===1?"término nocturno":"términos nocturnos"}`);
  if (def>=0.5) f.push(`Sueño ${logged?"registrado":"posible"}: ${fmtH(slept)}, ${fmtH(def)} bajo tu objetivo`);
  if (q && q<=3) f.push(`Calidad de sueño: ${SLQ[q-1].toLowerCase()}`);

    <div class="hdate"><span>${cap(fDay.format(now))}</span><h1>Hola, Jorge</h1></div>

    <div class="hk">
      <div><small>Servicio</small><b>${kS[0]}</b><span>${esc(kS[1])}</span></div>
      <div><small>Entreno</small><b>${kT[0]}</b><span>${esc(kT[1])}</span></div>

    <ul class="gt">${wk}</ul>${LEG}</div>

}

/* ---------- Agenda ---------- */
let calMode = "sem", calWs = null, curM = null;
const minM = "2026-09";
const maxM = () => { const a = PLAN_END.slice(0,7), b = (lastKey||"").slice(0,7); return a>b?a:b; };
function vCal(){
  const t = today();
  if (!calWs) calWs = weekStart(t<PLAN_START?PLAN_START:t);
  if (!curM) curM = t.slice(0,7);
  let body = "";
  if (calMode==="sem"){
    const we = addD(calWs,6);
    let fl = 0, tr = 0, sl = 0, sn = 0;
    for (let i=0;i<7;i++){ const s = addD(calWs,i), p = planned(s), n = night(s); if (info(s).type==="vuelo") fl++; if (isTrain(p) && p.auto!=="out") tr++; if (n.kind!=="none"){ sl += n.len/60; sn++; } }
    body = `<div class="wnav"><button type="button" class="iconb" data-act="wk7" data-v="-1" aria-label="Semana anterior">${FI.left}</button><div><b>${range(calWs,we)}</b><small>${weekOf(calWs)>=1 && weekOf(calWs)<=PLAN_WEEKS ? `Bloque: semana ${weekOf(calWs)} de ${PLAN_WEEKS}` : "Fuera del bloque"}</small></div><button type="button" class="iconb" data-act="wk7" data-v="1" aria-label="Semana siguiente">${FI.right}</button></div>
      <div class="card"><div class="kpis3" style="margin-top:0;border-top:0">
        <div style="padding-top:0"><small>Días de vuelo</small><b>${fl}</b></div>
        <div style="padding-top:0"><small>Sesiones</small><b>${tr}</b></div>
        <div style="padding-top:0"><small>Sueño medio</small><b>${sn?kg(sl/sn):"–"}<span> h</span></b></div>
      </div></div>
      <ul class="roster">${Array.from({length:7},(_,i)=>dayRow(addD(calWs,i))).join("")}</ul>
      <div style="margin:0 14px">${LEG}</div>`;
  } else {
    const first = `${curM}-01`, nm = `${nextM(curM)}-01`, start = monday(first), lastD = addD(nm,-1), end = addD(lastD, 6-wd(lastD));
    let g = ["L","M","M","J","V","S","D"].map(x=>`<span class="h">${x}</span>`).join("");
    for (let k=start; k<=end; k=addD(k,1)){
      const i = info(k), p = planned(k), r = getDay(k);
      const mk = isTrain(p) && p.auto!=="out" ? `<i class="mk${r.st==="hecha"||r.st==="parcial"?" ok":""}"></i>` : "";
      const lbl = `${fDay.format(noon(k))}: ${KIND[i.type]}${p?`, ${p.name}`:""}`;
      g += `<button type="button" class="mday${k.slice(0,7)!==curM?" out":""}${k===t?" today":""}" style="--t:${TONE[i.type]}" data-nav="dia" data-s="${k}" aria-label="${esc(lbl)}"><span class="n">${dnum(k)}</span><span class="c">${codeOf(i)||""}</span>${mk}</button>`;
    }
    body = `<div class="wnav"><button type="button" class="iconb" data-act="mon" data-v="-1" aria-label="Mes anterior"${curM<=minM?" disabled":""}>${FI.left}</button><div><b>${monthLabel(curM)}</b></div><button type="button" class="iconb" data-act="mon" data-v="1" aria-label="Mes siguiente"${curM>=maxM()?" disabled":""}>${FI.right}</button></div>
      <div class="mgrid">${g}</div>
      <div class="mlegend"><span style="--t:var(--fly)"><i></i>Vuelo</span><span style="--t:var(--away)"><i></i>Fuera</span><span style="--t:var(--res)"><i></i>Día B</span><span style="--t:var(--off)"><i></i>Libre</span><span style="--t:var(--ground)"><i></i>DH</span><span style="--t:var(--ground)"><i></i>Reserva o tierra</span><span><i style="background:var(--ex)"></i>Entrenamiento</span></div>`;
  }
  return `${bar("Agenda", moreBtn, true)}
    <div class="tabsx"><button type="button" data-act="calmode" data-v="sem" aria-pressed="${calMode==="sem"}">Semana</button><button type="button" data-act="calmode" data-v="mes" aria-pressed="${calMode==="mes"}">Mes</button></div>
    ${body}
    <div class="calfoot"><span>${lastKey ? `Programación hasta el ${fDM.format(noon(lastKey))}` : ""}</span><button type="button" class="btn ghost sm" data-act="import">Cargar programación</button></div>`;
}

/* ---------- Descanso ---------- */
let desSel = null;
function restParams(){
  const c = RC(), opt = (arr, v, f=x=>x) => arr.map(x => `<option value="${x}"${String(x)===String(v)?" selected":""}>${f(x)}</option>`).join("");
  const times = (a,b,st) => { const o = []; for (let m=a; m<=b; m+=st){ const h = Math.floor(m/60)%24; o.push(`${String(h).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`); } return o; };
  return `<div class="card">
    <div class="chd"><span class="ovl">Parámetros de descanso</span>${XI.gear.replace("<svg ","<svg width=\"16\" height=\"16\" style=\"color:var(--muted)\" ")}</div>
    <p class="lead">Con estos valores se calculan tu hora de acostarte, las siestas y la ventana de entrenamiento de cada día.</p>
    <div class="two" style="margin-top:12px">
      <div class="fld"><label for="rc-sl">Sueño objetivo</label><select id="rc-sl" data-act="rc" data-v="sleepH">${opt([6.5,7,7.5,8,8.5,9], c.sleepH, fmtH)}</select></div>
      <div class="fld"><label for="rc-pr">Despertar antes de presentarte</label><select id="rc-pr" data-act="rc" data-v="prep">${opt([60,75,90,105,120,150], c.prep, x=>fmtH(x/60))}</select></div>
      <div class="fld"><label for="rc-bd">Hora habitual de dormir</label><select id="rc-bd" data-act="rc" data-v="bed">${opt(times(21*60, 24*60+30, 30), c.bed)}</select></div>
      <div class="fld"><label for="rc-tr">Hora preferida de entreno</label><select id="rc-tr" data-act="rc" data-v="trainAt">${opt(times(6*60, 20*60, 60), c.trainAt)}</select></div>
    </div></div>`;
}
function vDes(){
  const t = today(), s = desSel || t, n0 = night(addD(s,-1)), n1 = night(s), rec = getDay(s), n = rec.n || {}, c = RC(), np = napOf(s);
  const hs = n.hs ?? null, plan = n0.kind==="none" ? null : n0.len/60;
  const caf = n1.kind!=="none" ? addM(n1.bed,-360) : null;
  const ups = duties.filter(d => ymd(d.s)>=s).slice(0,7);
  const gaps = ups.map(d => { const k = duties.indexOf(d), pv = duties[k-1]; if (!pv) return ""; const h = (d.s-pv.e)/36e5, ds = ymd(d.s);
    return `<li><span class="gd">${wdn(ds)} ${dnum(ds)}</span><span>${ymd(pv.e)===ds ? tt(pv.e) : `${wdn(ymd(pv.e))} ${dnum(ymd(pv.e))}, ${tt(pv.e)}`} → ${tt(d.s)}</span><b class="${gc(h)}">${fmtGap(h)}</b></li>`; }).join("");
  return `${bar("Descanso", moreBtn, true)}<div data-d="${s}">
    <div class="dnav"><button type="button" class="iconb" data-act="desd" data-v="-1" aria-label="Día anterior">${FI.left}</button><b>${s===t?"Hoy":cap(fDay.format(noon(s)))}</b><button type="button" class="iconb" data-act="desd" data-v="1" aria-label="Día siguiente">${FI.right}</button></div>
    <div class="card">
      <div class="chd"><span class="ovl">${s===t?"Esta noche":`Noche del ${wdn(s).toLowerCase()} ${dnum(s)}`}</span><small>Objetivo ${fmtH(c.sleepH)}</small></div>
      ${n1.kind==="none" ? `<p class="warn" style="margin:0">Entre jornadas no queda ventana para dormir. Siesta de 20-30 min donde puedas.</p>` : `
      <div class="sp"><div><small>${n1.kind==="pre"?"Sueño previo":"Acostarse"}</small><b>${tt(n1.bed)}</b></div><span class="spl">${FI.moon}<i></i>${hDur(n1.wake-n1.bed)}<i></i>${FI.sun}</span><div><small>Despertar</small><b>${tt(n1.wake)}</b></div></div>
      <p class="note">${n1.why ? `Ajustado por ${esc(n1.why)}${n1.short?`; quedan ${fmtH(c.sleepH - n1.len/60)} bajo tu objetivo`:""}.` : "Sin vuelos que condicionen esta noche: horario habitual."}</p>`}
      ${n1.recup ? `<p class="note">Al aterrizar, sueño de recuperación de ${tt(n1.recup.a)} a ${tt(n1.recup.b)}.</p>` : ""}
      ${np ? `<p class="note">Siesta sugerida de ${tt(np.a)} a ${tt(np.b)}, antes de la jornada de las ${tt(np.d.s)}.</p>` : ""}
    </div>
    ${readyCard(s)}
    <div class="card">
      <div class="chd"><span class="ovl">Registro de la noche anterior</span><small>${plan!=null?`Plan: ${fmtH(plan)}`:""}</small></div>
      <div class="flab"><span>Horas dormidas</span><b>${hs!=null?fmtH(hs):"Sin registrar"}</b></div>
      <div class="wstep"><button type="button" data-act="hs" data-n="-0.5" aria-label="Restar media hora">−</button><div class="wv"><b class="big">${hs!=null?kg(hs):"–"}</b><span>h</span></div><button type="button" data-act="hs" data-n="0.5" aria-label="Sumar media hora">+</button></div>
      <div class="flab" style="margin-top:16px"><span>Calidad</span><b>${n.sueno?SLQ[n.sueno-1]:"–"}</b></div>
      <div class="seg5" role="group" aria-label="Calidad del sueño">${SLQ.map((l,i)=>`<button type="button" class="${pop(`${s}:sl:${i+1}`)}" data-act="sueno" data-v="${i+1}" aria-pressed="${n.sueno===i+1}"><b>${i+1}</b><small>${l}</small></button>`).join("")}</div>
    </div>
    <div class="card"><div class="chd"><span class="ovl">Plan de sueño, 7 noches</span><small>Toca un día</small></div>
      <ul class="gt">${Array.from({length:7},(_,i)=>gRow(addD(s,i),"sueno")).join("")}</ul>${LEG}</div>
    ${gaps ? `<div class="card"><div class="chd"><span class="ovl">Descanso entre jornadas</span><small>Término → presentación</small></div><ul class="gaps">${gaps}</ul>
      <p class="note">En rojo, menos de 12 h; en ámbar, menos de 16 h. Esos días la app prioriza el sueño sobre el entrenamiento.</p></div>` : ""}
    <div class="card"><div class="chd"><span class="ovl">Pautas para hoy</span></div><ul class="tips">
      ${caf ? `<li>Última cafeína antes de las <b>${tt(caf)}</b>, 6 h antes de acostarte.</li>` : ""}
      <li>Entrenamiento intenso: termina al menos 2 h antes de dormir.</li>
      <li>Antes de una presentación temprana, cena liviana y pantalla fuera 30 min antes de acostarte.</li>
      <li>Tras un servicio nocturno, duerme a oscuras y despierta antes de las 13:00 para no desordenar la noche.</li>
      <li>Fuera de base, si vuelves en menos de 48 h, mantén el horario de Chile.</li>
    </ul></div>
    ${restParams()}
  </div>`;
}

/* ---------- Detalle del día ---------- */
function restRec(s, d){
  if (ymd(d.s)!==s) return "Dormir al llegar";
  if (ymd(d.e)!==s) return "8 h al llegar";
  return "8 h esta noche";
}
function vDia(s){
  const i = info(s), p = planned(s), rec = getDay(s), an = autoNote(p);
  let top;
  if (i.type==="vuelo"){
    const d = i.duty, k = duties.indexOf(d), pv = duties[k-1], nx = duties[k+1];
    const codes = [d.legs[0].split("-")[0], ...d.legs.map(l=>l.split("-")[1])];
    top = `<div class="card ops">
      <div class="chd"><span class="pill" style="--t:var(--fly)">Vuelo</span><small>${d.legs.length} ${d.legs.length===1?"tramo":"tramos"}${lastDest(d)!=="SCL"?` · pernocta en ${city(lastDest(d))}`:""}</small></div>
      <div class="route">${codes.map(c=>`<span><b>${c}</b><small>${esc(city(c))}</small></span>`).join(`<i>${FI.right}</i>`)}</div>
      <div class="opsg"><div><small>Presentación</small><b>${esc(startTxt(d))}</b></div><div><small>Término</small><b>${esc(endTxt(d))}</b></div><div><small>Jornada</small><b>${hShort(d.e-d.s)} h${d.est?"*":""}</b></div></div>
      <div class="opsr">${pv?`<div><small>Descanso previo</small><b class="${gc((d.s-pv.e)/36e5)}">${fmtGap((d.s-pv.e)/36e5)}</b></div>`:"<div></div>"}${nx?`<div><small>Descanso posterior</small><b class="${gc((nx.s-d.e)/36e5)}">${fmtGap((nx.s-d.e)/36e5)}</b></div>`:"<div></div>"}<div><small>Dormir</small><b>${restRec(s,d)}</b></div></div>
      ${d.est?`<p class="note">* Término estimado.</p>`:""}
    </div>`;
  } else {
    const txt = i.type==="fuera" ? `${i.place?`Todo el día en ${city(i.place)}.`:"Pernoctas fuera de Santiago."}${i.back?` Vuelves el ${fDay.format(noon(i.back))}.`:""}`
      : i.type==="blanco" ? `Hasta las 21:00 del día anterior te pueden asignar actividad.${i.note?` ${esc(i.note)}`:""}`
      : i.type==="act" ? `De ${i.st} a ${i.en}. ${i.home ? "Debes estar disponible para un llamado; entrena después de las 12:00." : "Actividad presencial; el sueño y el entreno se ajustan a este horario."}`
      : i.type==="libre" ? (i.code==="DR" ? "DR: día de descanso, sin vuelos." : "Sin vuelos. Día libre en Santiago.") : i.type==="tierra" ? "Feriado devuelto, sin vuelos." : "Este día no está en la programación cargada.";
    top = `<div class="kcard" style="--t:${TONE[i.type]}"><b>${i.type==="act" ? esc(i.label) : KIND[i.type]}</b><p>${txt}</p></div>`;
  }
  let plan;
  if (!p) plan = `<div class="card"><div class="chd"><span class="ovl">Entrenamiento</span></div><p class="empty" style="margin:0">Fuera del bloque actual (${sh(PLAN_START)} al ${sh(PLAN_END)}).</p></div>`;
  else {
    const tr = isTrain(p) && p.auto!=="out", tw = trainWin(s,p);
    const ic = tr ? `<span class="ic ex">${FI.dumb}</span>` : p.key==="P" ? `<span class="ic rest">${FI.walk}</span>` : `<span class="ic rest">${FI.moon}</span>`;
    const bd = tr ? `<span class="bdg ex">Entreno</span>` : `<span class="bdg rest">Descanso</span>`;
    plan = `<div class="card"><div class="chd"><span class="ovl">Entrenamiento</span><small>Semana ${weekOf(s)} de ${PLAN_WEEKS}, día ${dayOf(s)}</small></div>
      <div class="pch">${ic}<div><b>${p.name}</b><small>${esc(p.det)}</small></div>${bd}</div>
      ${tr ? (tw.none ? `<div class="winrow no">${XI.info}<span>Sin ventana segura de ${tw.D} min entre sueño y servicio.</span></div>` : `<div class="winrow">${XI.ok}<span>Ventana sugerida: <b>${tt(tw.a)} a ${tt(tw.b)}</b></span></div>`) : ""}
      <p class="tipline">${esc(adaptFor(s,p))}</p>${an?`<span class="autotag">${an}</span>`:""}
      ${tr ? segHtml(s, rec.st||"") : ""}
      ${tr && p.rt ? `<button type="button" class="rowlink" data-nav="rut" data-s="${s}"><span class="play">${FI.play}</span><span class="tx"><b>Rutina de Coke</b><small>Ejercicios, kilos y tiempos</small></span>${chev}</button>` : ""}
      ${fieldsHtml(s, p)}</div>`;
  }
  const hb = habCount(rec);
  return `${bar("Detalle del día")}<div data-d="${s}">
    <h2 class="dtitle">${cap(fDay.format(noon(s)))}</h2>
    ${top}
    ${dayPlanCard(s, false)}
    ${plan}
    ${readyCard(s)}
    <div class="card" style="padding:4px 16px"><button type="button" class="rowlink" style="border:0;background:transparent;padding:10px 0;margin:0" data-nav="nut" data-s="${s}"><span class="ic ex" style="width:34px;height:34px">${FI.apple}</span><span class="tx"><b>Nutrición y hábitos</b><small>${hb} de ${HKEYS.length} hábitos cumplidos</small></span>${chev}</button></div>
    ${notesCard(s)}</div>`;
}

/* ---------- Entrenamiento ---------- */
let entSel = null;
function vEnt(){
  const t = today(), s = entSel || (t<PLAN_START?PLAN_START:t), ws = weekStart(s), wn = weekOf(s), p = planned(s), rec = getDay(s), wk = weekDays(ws);
  const circ = wk.out.map(x => `<button type="button" class="${x.s===s?"sel":""}" data-act="entday" data-v="${x.s}" aria-label="${esc(cap(fDay.format(noon(x.s))))}"><span>${ini(x.s)}</span><i class="cir ${x.st}${x.s===t?" today":""}">${x.ic}</i></button>`).join("");
  const inB = wn>=1 && wn<=PLAN_WEEKS;
  const head = `<div class="card"><div class="chd"><span class="ovl">${inB?`Semana ${wn} de ${PLAN_WEEKS}`:"Fuera del bloque"}</span><small>${sh(ws)} al ${sh(addD(ws,6))}</small></div>
    <div class="pbar" style="margin-top:0"><i style="width:${Math.round(wk.comp/7*100)}%"></i></div><p class="pcap">${wk.comp} de 7 días completados</p>
    <div class="circles">${circ}</div>
    <div class="legend"><span><i style="--c:var(--ex)"></i>Entreno hecho</span><span><i style="--c:var(--rest)"></i>Descanso</span><span><i style="--c:var(--fly)"></i>Vuelo</span></div></div>`;
  const ttl = s===t ? "Plan de hoy" : `Plan del ${wdn(s).toLowerCase()} ${dnum(s)}`;
  const tr = isTrain(p) && p.auto!=="out", tw = trainWin(s,p);
  const win = tr ? (tw.none ? `<div class="winrow no">${XI.info}<span>Sin ventana segura de ${tw.D} min: haz 20-25 min o recuperación activa.</span></div>` : `<div class="winrow">${XI.ok}<span>Ventana sugerida: <b>${tt(tw.a)} a ${tt(tw.b)}</b>, coordinada con tu sueño y tus vuelos.</span></div>`) : "";
  let body = "";
  if (!p) body = `<h3 class="sec">${ttl}</h3><div class="card"><p class="empty" style="margin:0">Este día está fuera del bloque (${sh(PLAN_START)} al ${sh(PLAN_END)}).</p></div>`;
  else if (tr && p.rt){
    const r = ROUT[p.rt], w = rwk(s), ex = rec.ex || {};
    const items = [
      `<li><button type="button" data-act="wu" aria-pressed="${!!rec.wu}"><span class="bx">${CHECK}</span><span><b>Calentamiento</b><small>${WARM.map(x=>x[0]).join(" y ")}</small></span></button></li>`,
      `<li><button type="button" data-act="actv" aria-pressed="${!!rec.actv}"><span class="bx">${CHECK}</span><span><b>Activación</b><small>${esc(r.act)}</small></span></button></li>`,

        return `<li><button type="button" class="${pop(`${s}:ex:${e.id}`)}" data-act="exdone" data-v="${e.id}" aria-pressed="${!!ex[e.id]?.done}"><span class="bx">${CHECK}</span><span><b>${esc(nm)} (${vol})</b><small>${load ? (load==="PC"?"Peso corporal":load) : ""}${r.circuit?" · 5 vueltas":""}</small></span></button></li>`; })
    ].join("");
    const done = r.ex.filter(e => ex[e.id]?.done).length;
    body = `<h3 class="sec">${ttl} <small>${done} de ${r.ex.length} ejercicios</small></h3>
      <div class="card"><div class="pch"><span class="ic ex">${FI.dumb}</span><div><b>${p.name}</b><small>Semana ${w}: ${r.weeks[w-1]}</small></div><span class="bdg ex">Entreno</span></div>

      <div class="card" style="padding:4px 16px 14px"><button type="button" class="rowlink" data-nav="rut" data-s="${s}"><span class="play">${FI.play}</span><span class="tx"><b>${r.circuit?"Cronómetro y tiempos por vuelta":"Kilos, esfuerzo y estado"}</b><small>${r.ex.length} ejercicios${r.circuit?", 5 vueltas con 1:30 de descanso":""}</small></span>${chev}</button></div>`;
  } else if (tr){
    body = `<h3 class="sec">${ttl}</h3>
      <div class="card" data-d="${s}"><div class="pch"><span class="ic ex">${p.type==="fuerza"?FI.dumb:FI.walk}</span><div><b>${p.name}</b><small>${esc(p.det)}</small></div><span class="bdg ex">Entreno</span></div>${win}${an(p)}
        <p class="tipline">${esc(adaptFor(s,p))}</p>${segHtml(s, rec.st||"")}${fieldsHtml(s,p)}</div>`;
  } else {
    const n = nextTrain(s, false), fl = info(s).type==="vuelo";
    body = `<h3 class="sec">${ttl}</h3>

function vRut(s){

  const r = ROUT[p.rt], w = rwk(s), rec = getDay(s), ex = rec.ex || {};
  const nDone = r.ex.filter(e => ex[e.id]?.done).length;
  const rows = r.ex.map(e => {
    const [vol, load, crit] = e.w[w-1], name = Array.isArray(e.n) ? e.n[w-1] : e.n, st = ex[e.id] || {};
    const hasKg = /kg/.test(load) && !r.circuit, prev = hasKg ? lastOf(s, d => d.ex?.[e.id]?.kg) : null;
    return `<li class="exr${st.done?" done":""}"><span class="gly">${GL[GLY[e.id]]||GL.sq}</span>
      <div class="exi"><b>${esc(name)}</b><span class="cr">${crit}${prev?` Última vez: ${esc(prev[1])} kg.`:""}</span>
        ${hasKg ? `<div class="kgs"><button type="button" data-act="kgstep" data-v="${e.id}" data-n="-2.5" aria-label="Bajar 2,5 kg">−</button><input type="text" inputmode="decimal" class="exkg" data-act="exkg" data-v="${e.id}" value="${esc(st.kg??"")}" placeholder="${(load.match(/[\d,]+/)||[""])[0]}" aria-label="Kilos usados en ${esc(name)}"><button type="button" data-act="kgstep" data-v="${e.id}" data-n="2.5" aria-label="Subir 2,5 kg">+</button></div>` : ""}</div>
      <div class="exs"><span class="vol">${vol}<small>${load ? (load==="PC"?"peso corporal":load) : ""}</small></span><button type="button" class="exck${pop(`${s}:ex:${e.id}`)}" data-act="exdone" data-v="${e.id}" aria-pressed="${!!st.done}" aria-label="${esc(name)} hecho">${CHECK}</button></div></li>`;
  }).join("");
  let laps = "";
  if (r.circuit){
    const L = rec.laps || [], prev = lastOf(s, d => (d.laps||[]).some(x=>x) ? d.laps : null);
    const tot = L.map(parseT).filter(x=>x!=null), ptot = prev ? prev[1].map(parseT).filter(x=>x!=null) : [];
    const sum = a => a.reduce((x,y)=>x+y,0);
    laps = `<h3 class="sec">Circuito: 5 vueltas</h3><div class="card">${cronoHtml(s)}
      <div class="laps">${[0,1,2,3,4].map(i => { const a = parseT(L[i]), b = prev ? parseT(prev[1][i]) : null;
        return `<div class="lap${a!=null?" set":""}"><label for="lap-${s}-${i}">V${i+1}</label><input id="lap-${s}-${i}" type="text" inputmode="numeric" data-act="lap" data-v="${i}" value="${esc(L[i]??"")}" placeholder="${b!=null?fmtT(b):"0:00"}">${a!=null&&b!=null?`<small class="${a<=b?"up":"dn"}">${a<=b?"−":"+"}${fmtT(Math.abs(a-b))}</small>`:""}</div>`; }).join("")}</div>
      <p class="note" data-laptot>${tot.length ? `Total ${fmtT(sum(tot))}${ptot.length===tot.length ? (sum(tot)<=sum(ptot) ? `, ${fmtT(sum(ptot)-sum(tot))} más rápido que el ${sh(prev[0])}` : `, ${fmtT(sum(tot)-sum(ptot))} más lento que el ${sh(prev[0])}`) : ""}.` : "Usa el cronómetro o escribe cada vuelta. Descanso de 1:30 min entre vueltas."}</p><p class="note"><b>Objetivo de Coke:</b> registrar el mejor tiempo posible manteniendo una buena técnica. El circuito no cambia en las 4 semanas.</p></div>`;
  }
  const tw = trainWin(s,p);
  return `${bar("Rutina")}<div data-d="${s}"><div class="routine">
    <div class="rtitle"><h2>${p.name}</h2><p>${cap(fDay.format(noon(s)))}. Semana ${w} de ${PLAN_WEEKS}: ${r.weeks[w-1]}.</p></div>
    <div class="card"><div class="chd"><span class="ovl">Calentamiento</span></div><ul class="wlist" style="margin-top:0">${WARM.map(([a,b])=>`<li><b>${a}.</b> ${b}</li>`).join("")}<li><b>Activación.</b> ${r.act}</li></ul></div>
    <h3 class="sec">Ejercicios <small>${nDone} de ${r.ex.length}</small></h3>
    <div class="card"><ul class="exl">${rows}</ul></div>
    ${laps}
    <h3 class="sec">Registro</h3>
    <div class="card">${p.auto==="out" ? `<p class="empty" style="margin:0">Hoy toca recuperación activa por el vuelo.</p>` : segHtml(s, rec.st||"")}${fieldsHtml(s,p)}</div>
    <div class="tipbox">${FI.bulb}<div>${tw && !tw.none ? `<p><b>Ventana sugerida: ${tt(tw.a)} a ${tt(tw.b)}.</b></p>` : ""}<p>${esc(adaptFor(s,p))}</p><p>Si llegas cansado del vuelo, baja la intensidad a RPE 6 y mantén la técnica.</p></div></div>
  </div></div>`;
}

/* ---------- Progreso ---------- */
let progTab = "sem";
function chart(ws){
  const W=340,H=190,L=34,R2=12,Tp=12,B=26, x0=noon("2026-08-10"), x1=noon("2027-01-31");
  const ys = ws.map(w=>w[1]); const ymin = Math.min(82, Math.floor(Math.min(...ys)-1)), ymax = Math.max(100, Math.ceil(Math.max(...ys)+1));
  const X = s => L + (noon(s)-x0)/(x1-x0)*(W-L-R2), Y = v => Tp + (ymax-v)/(ymax-ymin)*(H-Tp-B);
  let g = "";
  for (let v=Math.ceil(ymin/5)*5; v<=ymax; v+=5) g += `<line x1="${L}" x2="${W-R2}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+3.5}" text-anchor="end">${v}</text>`;
  [["2026-08-22","ago"],["2026-09-15","sep"],["2026-10-15","oct"],["2026-11-15","nov"],["2026-12-15","dic"],["2027-01-15","ene"]].forEach(([s,l]) => g += `<text x="${X(s)}" y="${H-8}" text-anchor="middle">${l}</text>`);
  g += `<rect x="${X(PLAN_START)}" y="${Tp}" width="${X(PLAN_END)-X(PLAN_START)}" height="${H-Tp-B}" fill="var(--blue)" opacity=".07"/>`;
  g += `<line x1="${L}" x2="${W-R2}" y1="${Y(W_GOAL)}" y2="${Y(W_GOAL)}" stroke="var(--ex)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R2}" y="${Y(W_GOAL)-6}" text-anchor="end" style="fill:var(--ex)">Meta ${W_GOAL} kg</text>`;
  if (ws.length>=3){
    const ma = ws.map((w,i) => { const a = ws.slice(Math.max(0,i-2), i+1); return [w[0], a.reduce((s,x)=>s+x[1],0)/a.length]; });
    g += `<polyline points="${ma.map(([s,v])=>`${X(s).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--blue)" stroke-opacity=".25" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  g += `<polyline points="${ws.map(([s,v])=>`${X(s).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>`;
  g += ws.map(([s,v]) => `<circle cx="${X(s)}" cy="${Y(v)}" r="3.4" fill="var(--card)" stroke="var(--blue)" stroke-width="2"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de peso frente a la meta de ${W_GOAL} kg; la franja marca el bloque actual">${g}</svg>`;
}

/* ---------- Navegación ---------- */
let R = {v:"inicio"}, HIST = [], prevTab = "inicio";
const TABS = [["inicio","Hoy",FI.home],["cal","Agenda",FI.cal],["des","Descanso",FI.moon],["ent","Entreno",FI.dumb],["nut","Nutrición",FI.apple]];
const TAB_OF = {inicio:"inicio",cal:"cal",dia:"cal",des:"des",ent:"ent",rut:"ent",nut:"nut",prog:"",mas:""};
$("#tabs").innerHTML = TABS.map(([k,l,i]) => `<button type="button" data-nav="${k}" data-tab>${i}<span>${l}</span></button>`).join("");
function render(force){
  const a = document.activeElement;
  if (!force && a && a.matches("#view textarea, #view input, #view select")) return;
  const v = R.v;
  $("#view").innerHTML = v==="inicio" ? vInicio() : v==="cal" ? vCal() : v==="dia" ? vDia(R.s) : v==="ent" ? vEnt() : v==="rut" ? vRut(R.s) : v==="nut" ? vNut() : v==="des" ? vDes() : v==="prog" ? vProg() : vMas();
  document.body.dataset.v = v;
  document.querySelectorAll("#tabs [data-tab]").forEach(b => b.dataset.nav===TAB_OF[v] ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  popKey = null; showSync();
}
const rerender = render;
function nav(v, s){
  if (!(R.v===v && R.s===s)) HIST.push(R);
  if (HIST.length>30) HIST.shift();
  R = {v, s}; render(true); window.scrollTo({top:0});
}
function back(){ R = HIST.pop() || {v:"inicio"}; render(true); window.scrollTo({top:0}); }
function go(t){ nav(t==="aj" ? "mas" : t==="hoy" ? "inicio" : t); }
document.addEventListener("click", e => {
  const n = e.target.closest("[data-nav]");
  if (n){
    const v = n.dataset.nav, s = n.dataset.s;
    if (v==="ent") entSel = s || null;
    if (v==="des") desSel = s || null;
    if (v==="nut") nutSel = s || null;
    if (n.hasAttribute("data-tab")){ HIST = []; R = {v}; calWs = null; curM = null; render(true); window.scrollTo({top:0}); return; }
    return nav(v, s);
  }
  if (e.target.closest("[data-back]")) return back();
  const b = e.target.closest("[data-act]"); if (!b || ["INPUT","TEXTAREA","SELECT"].includes(b.tagName)) return;
  const a = b.dataset.act, v = b.dataset.v, s = b.closest("[data-d]")?.dataset.d;
  switch(a){
    case "calmode": calMode = v; break;
    case "wk7": calWs = addD(calWs, 7*(+v)); break;
    case "mon": curM = +v>0 ? nextM(curM) : prevM(curM); break;
    case "entday": entSel = v; break;
    case "desd": desSel = addD(desSel||today(), +v); break;
    case "nutd": { const x = addD(nutSel||today(), +v); nutSel = x>today() ? today() : x; break; }
    case "progtab": progTab = v; break;
    case "wu": case "actv": { const r = getDay(s); setDay(s, {[a]: !r[a]}); break; }
    case "ml": { const r = getDay(s), ml = Object.assign({}, r.ml); ml[v] = !ml[v]; setDay(s, {ml}); break; }
    default: return;
  }
  render(true);
});

/* Respaldo: exportar e importar */
async function saveFile(name, data, mime){
  try {
    if (DL){ await DL.save({filename:name, data}); }
    else {
      const url = URL.createObjectURL(new Blob([data], {type:mime+";charset=utf-8"}));
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    toast("Archivo descargado");
  } catch(err){ if (err?.code!=="declined") toast("No se pudo descargar el archivo."); }
}
async function importBackup(file){
  try {
    const j = JSON.parse(await file.text()), d = j && j.app==="flyfit" ? j.data : null;
    if (!d || typeof d!=="object") throw 0;
    let n = 0;
    for (const k of Object.keys(PFX)){
      const src = d[k]; if (!src || typeof src!=="object") continue;
      for (const [key,val] of Object.entries(src)){ if (val==null) continue; S[k][key] = val; save(k, key); n++; }
    }
    rebuild(); render(true);
    toast(n ? `Respaldo importado: ${n} registros` : "El respaldo no tenía registros");
  } catch(e){ toast("Ese archivo no es un respaldo de FlyFit."); }
}
document.addEventListener("change", e => { const el = e.target; if (el.dataset?.act==="bkimp" && el.files?.[0]) importBackup(el.files[0]); });

/* Eventos */
function noteSaved(el){ const sv = el.parentElement.querySelector(".saved"); if (!sv) return; sv.textContent = "Guardado"; clearTimeout(sv._t); sv._t = setTimeout(()=>sv.textContent="",1500); }
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n) ? Math.round(n*10)/10 : null; };
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b || ["INPUT","TEXTAREA","SELECT"].includes(b.tagName)) return;
  const a = b.dataset.act, s = b.closest("[data-d]")?.dataset.d, rec = s ? getDay(s) : null, v = b.dataset.v;
  switch(a){
    case "import": return openImport();
    case "impclose": return closeImport();
    case "impread": return impRead();
    case "impback": imp.state = "form"; return renderImp();
    case "impsave": {
      imp.arr.forEach(x => { S.sched[x.date] = x; save("sched", x.date); });
      rebuild(); closeImport(); curM = imp.m;
      toast(`Programación de ${monthLabel(imp.m).toLowerCase()} guardada`); return rerender(true);
    }
    case "goaj": return go("aj");
    case "ajback": return go(prevTab);
    case "full": fullView.add(s); break;
    case "st": { const nv = rec.st===v ? "" : v; popKey = `${s}:st:${nv}`; setDayUndo(s, {st:nv}, nv ? `Sesión: ${LBL[nv].toLowerCase()}` : "Estado quitado"); break; }
    case "rpe": { const x = rec.rpe==null ? 6 : Math.max(1, Math.min(10, rec.rpe + +v)); setDay(s, {rpe:x}); break; }
    case "rpe0": setDay(s, {rpe:null}); break;
    case "dur": setDay(s, {min: rec.min===+v ? null : +v}); break;
    case "rpev": setDay(s, {rpe: rec.rpe===+v ? null : +v}); break;
    case "kgstep": {
      const ex = JSON.parse(JSON.stringify(rec.ex||{})), inp = b.parentElement.querySelector("input");
      const base = kgNum(ex[v]?.kg) ?? kgNum(inp?.placeholder) ?? 0, nv = Math.max(0, base + +b.dataset.n);
      ex[v] = Object.assign({}, ex[v], {kg: kgFmt(nv)}); setDay(s, {ex}); if (inp) inp.value = kgFmt(nv); return;
    }
    case "vaso": {
      const n = Object.assign({}, rec.n), g = Math.floor((n.agua||0)/500), i = +v;
      n.agua = (i+1)===g ? i*500 : (i+1)*500;
      setDayUndo(s, {n}, `Agua: ${lt(n.agua)} L`); refreshHab(b.closest(".habcard"), s); return;
    }
    case "hs": {
      const n = Object.assign({}, rec.n), h = Object.assign({}, rec.h), n0 = night(addD(s,-1));
      const base = n.hs ?? Math.round((n0.kind==="none" ? 0 : n0.len/60)*2)/2;
      n.hs = Math.max(0, Math.min(14, base + (n.hs==null ? 0 : +b.dataset.n)));
      h.sueno = n.hs>=7 || (n.sueno||0)>=4; setDay(s, {n, h}); break;
    }
    case "light": setDayUndo(s, {ov:"P"}, "Cambiado a recuperación activa"); break;
    case "sueno": {
      const n = Object.assign({}, rec.n), h = Object.assign({}, rec.h);
      if (n.sueno===+v) { delete n.sueno; h.sueno = false; } else { n.sueno = +v; h.sueno = +v>=4; }
      popKey = `${s}:sl:${v}`; setDay(s, {n, h}); break;
    }
    case "sugar": {
      const h = Object.assign({}, rec.h); h.azucar = !h.azucar;
      setDayUndo(s, {h}, h.azucar ? "Sin azúcar: listo" : "Sin azúcar: desmarcado");
      b.setAttribute("aria-checked", h.azucar); refreshHab(b.closest(".habcard"), s); return;
    }
    case "cstart": CRONO = {s, run:true, t0:Date.now(), rest:0}; return replaceCrono(s);
    case "cstop": CRONO = {s:null, run:false, t0:0, rest:0}; return replaceCrono(s);
    case "clap": {
      const c = cronoState(s); if (c.mode!=="run") return;
      const secs = Math.round((Date.now()-CRONO.t0)/1000), L = [...(rec.laps||["","","","",""])];
      L[c.n] = fmtT(secs); CRONO = {s, run:false, t0:0, rest: c.n<4 ? Date.now()+90000 : 0};
      setDay(s, {laps:L}); try { navigator.vibrate?.(40); } catch(e){}
      toast(`Vuelta ${c.n+1}: ${fmtT(secs)}`); break;
    }
    case "wstep": { const el = $("#wKg"), x = num(el.value) ?? weights().at(-1)[1]; el.value = kg(Math.max(30, Math.round((x + +b.dataset.n)*10)/10)); return; }
    case "theme": { S.cfg.ui = {theme:v}; save("cfg","ui"); try { localStorage.setItem("bitacora-theme", v); } catch(e){} applyTheme(); break; }
    case "exdone": {
      const ex = JSON.parse(JSON.stringify(rec.ex||{})); ex[v] = Object.assign({}, ex[v], {done:!ex[v]?.done});
      popKey = `${s}:ex:${v}`;
      const sess = planned(s), r = ROUT[sess?.rt], all = r && r.ex.every(e => ex[e.id]?.done);
      const patch = {ex}; if (all && !rec.st) patch.st = "hecha";
      setDayUndo(s, patch, patch.st ? "Rutina completa ✓" : ex[v].done ? "Ejercicio listo" : "Ejercicio desmarcado"); break;
    }
    case "chk": { const h = Object.assign({}, rec.h); h[v] = !h[v]; popKey = `${s}:chk:${v}`; setDayUndo(s, {h}, `${HAB[v].l}: ${h[v]?"listo":"desmarcado"}`); break; }
    case "add": {
      const n = Object.assign({}, rec.n); n[v] = Math.max(0, (n[v]||0) + +b.dataset.n);
      setDayUndo(s, {n}, v==="agua" ? `Agua: ${lt(n.agua)} L` : `Proteína: ${n.prot} g`);
      refreshHab(b.closest(".habcard"), s); return;
    }
    case "meal": {
      const m = meals()[+v]; if (!m) return;
      const n = Object.assign({}, rec.n), log = [...(rec.log||[]), {name:m.name, kcal:m.kcal, prot:m.prot}];
      n.kcal = (n.kcal||0) + (m.kcal||0); n.prot = (n.prot||0) + (m.prot||0);
      setDayUndo(s, {n, log}, `${m.name}: +${nf(m.kcal)} kcal, +${nf(m.prot)} g`); break;
    }
    case "unmeal": {
      const log = [...(rec.log||[])], m = log.splice(+v,1)[0]; if (!m) return;
      const n = Object.assign({}, rec.n); n.kcal = Math.max(0,(n.kcal||0)-(m.kcal||0)); n.prot = Math.max(0,(n.prot||0)-(m.prot||0));
      setDayUndo(s, {n, log}, `${m.name} quitado`); break;
    }
    case "mealadd": {
      const name = $("#mlN").value.trim(), kc = Math.round(+$("#mlK").value||0), pr = Math.round(+$("#mlP").value||0);
      if (!name || (!kc && !pr)) return toast("Escribe el nombre y al menos las calorías o la proteína.");
      S.cfg.meals = {list:[...meals(), {name, kcal:kc, prot:pr}]}; save("cfg","meals"); toast(`${name} agregada`); break;
    }
    case "mealdel": {
      const prev = meals(), list = prev.filter((_,i)=>i!==+v);
      S.cfg.meals = {list}; save("cfg","meals");
      toast("Comida borrada", () => { S.cfg.meals = {list:prev}; save("cfg","meals"); rerender(true); }); break;
    }
    case "wkclose": { const w = b.closest("[data-w]").dataset.w; S.weeks[w] = Object.assign({}, S.weeks[w], {done:true}); save("weeks", w); toast("Semana cerrada"); break; }
    case "wsave": {
      const d = $("#wDate").value, x = num($("#wKg").value), err = $("#wErr");
      if (!d || x==null || x<40 || x>200){ err.hidden = false; err.textContent = "Escribe un peso válido, por ejemplo 95,8."; return; }
      S.weights[d] = {kg:x}; save("weights", d); toast(`Peso guardado: ${kg(x)} kg`); break;
    }
    case "wdel": { const prev = S.weights[v]; S.weights[v] = null; save("weights", v); delete S.weights[v]; persistLocal();
      toast("Pesaje borrado", () => { S.weights[v] = prev; save("weights", v); rerender(true); }); break; }
    case "msave": {
      const d = $("#mDate").value, r = {};
      MF.forEach(([k]) => { const x = num($("#m-"+k).value); if (x!=null) r[k] = x; });
      if (!d || !Object.keys(r).length) return toast("Completa al menos una medida.");
      S.meds[d] = Object.assign({}, S.meds[d], r); save("meds", d); toast("Medidas guardadas"); break;
    }
    case "mdel": { const prev = S.meds[v]; S.meds[v] = null; save("meds", v); delete S.meds[v]; persistLocal();
      toast("Medición borrada", () => { S.meds[v] = prev; save("meds", v); rerender(true); }); break; }
    case "csv": return saveFile(`flyfit-jorge-${today()}.csv`, buildCsv(), "text/csv");
    case "bkexp": return saveFile(`flyfit-respaldo-${today()}.json`, JSON.stringify({app:"flyfit", v:1, at:new Date().toISOString(), data:S}), "application/json");
    default: return;
  }
  rerender(true);
});

/* Cronómetro */
function replaceCrono(s){ document.querySelectorAll(`[data-crono="${s}"]`).forEach(el => el.outerHTML = cronoHtml(s)); }
setInterval(() => {
  document.querySelectorAll("[data-crono]").forEach(el => {
    const s = el.dataset.crono, c = cronoState(s);
    if (!el.classList.contains(c.mode)){ if (c.mode==="ready" && el.classList.contains("rest")) { try { navigator.vibrate?.(200); } catch(e){} toast("Descanso terminado"); } el.outerHTML = cronoHtml(s); return; }
    if (c.mode==="run") el.querySelector("[data-cv]").textContent = fmtT(c.el);
    if (c.mode==="rest") el.querySelector("[data-cv]").textContent = fmtT(Math.ceil(c.left));
  });
}, 250);
/* Arranque */
rebuild(); render(true); showSync();
setInterval(() => { if (R.v==="inicio") render(false); }, 30000);

(async () => {
  try {
    if (!window.claude?.use) return;
    claude.use("sample").then(x => { SAMPLE = x; });
    claude.use("downloads").then(x => { DL = x; if (R.v==="mas") rerender(); });
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    DB = db; BASE = "data/users/"+id;
    let first = true;
    DB.collection(BASE).onSnapshot(snap => {
      if (first){
        first = false;
        const hasLocal = Object.keys(PFX).some(k => Object.keys(S[k]).length);
        if (snap.empty && hasLocal){ for (const k of Object.keys(PFX)) for (const key of Object.keys(S[k])) { PEND[PFX[k]+key] = 1; } persistPend(); flushAll(); showSync(); return; }
        flushAll();
      }
      const next = EMPTY();
      snap.docs.forEach(d => { const [k,key] = splitId(d.id); if (k) next[k][key] = d.data(); });
      for (const pid of Object.keys(PEND)){ const [k,key] = splitId(pid); if (!k) continue; if (S[k][key]!=null) next[k][key] = S[k][key]; else delete next[k][key]; }
      S = next; persistLocal(); rebuild(); applyTheme(); showSync(); rerender();
    }, () => { syncErr = true; showSync(); });
  } catch(e){ syncErr = true; showSync(); }
})();
</script>
</body>
