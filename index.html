<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E2D69">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlyFit</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlyFit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FA; --card:#FFFFFF; --card2:#F5F8FD; --ink:#0F1F3D; --text:#3A4763; --muted:#7D89A0; --line:#E4EAF3; --line2:#D3DCEA;
  --navy:#0E2D69; --navy2:#1A4594; --blue:#1B66E3; --blue-soft:#E7F0FD; --on-blue:#FFFFFF;
  --fly:#7B55D9; --fly-soft:#F1EBFD; --fly-line:#DDD0FA;
  --ex:#1F9D57; --ex-soft:#E4F6EB; --ex-line:#C8EBD5;
  --rest:#3A86E5; --rest-soft:#E5F0FD;
  --teal:#159A8C; --off:#1F9D57; --away:#0F8A9D; --res:#DB8212; --ground:#5B7083; --none:#A3ADBD; --warn:#D9472B; --flame:#F2771A;
  --sh:0 1px 2px rgba(16,40,90,.04),0 8px 22px rgba(16,40,90,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1222; --card:#121C30; --card2:#17233A; --ink:#EEF3FC; --text:#C4CEE0; --muted:#8693AB; --line:#1F2B44; --line2:#2C3B58;
  --navy:#0B1F4A; --navy2:#16357A; --blue:#4D8DF5; --blue-soft:#16294A; --on-blue:#FFFFFF;
  --fly:#A68BF0; --fly-soft:#221B3D; --fly-line:#3A2E66; --ex:#3BC27A; --ex-soft:#12301F; --ex-line:#1F4A33;
  --rest:#6AA6F2; --rest-soft:#14294A; --teal:#35C2B1; --off:#3BC27A; --away:#3CC0D1; --res:#F0A040; --ground:#9FB0C4; --none:#5E6A80; --warn:#FF6B4E;
  --sh:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A1222; --card:#121C30; --card2:#17233A; --ink:#EEF3FC; --text:#C4CEE0; --muted:#8693AB; --line:#1F2B44; --line2:#2C3B58;
  --navy:#0B1F4A; --navy2:#16357A; --blue:#4D8DF5; --blue-soft:#16294A; --on-blue:#FFFFFF;
  --fly:#A68BF0; --fly-soft:#221B3D; --fly-line:#3A2E66; --ex:#3BC27A; --ex-soft:#12301F; --ex-line:#1F4A33;
  --rest:#6AA6F2; --rest-soft:#14294A; --teal:#35C2B1; --off:#3BC27A; --away:#3CC0D1; --res:#F0A040; --ground:#9FB0C4; --none:#5E6A80; --warn:#FF6B4E;
  --sh:none; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.45 "Inter","Helvetica Neue","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body[data-v="inicio"]::before{background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{color:var(--ink);margin:0}
.app{max-width:480px;margin:0 auto;padding:0 0 calc(92px + env(safe-area-inset-bottom,0px))}
#view{min-height:60vh}
.pad{padding:0 18px}

/* Barra superior */
.bar{display:flex;align-items:center;gap:10px;padding:16px 14px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.bar h1{font-size:1.18rem;font-weight:700;flex:1}
.backb{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.backb svg{width:22px;height:22px}
.bar .act{border:0;background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:.82rem;padding:7px 12px;border-radius:999px}

/* Inicio */
.hero{background:linear-gradient(160deg,var(--navy2),var(--navy) 60%);color:#fff;padding:20px 20px 74px;border-radius:0 0 26px 26px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.logo svg{width:30px;height:30px;color:#fff}
.brand b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand small{font-size:.86rem;opacity:.8}
.avatar{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--navy);display:grid;place-items:center}
.avatar svg{width:22px;height:22px}
.hero h2{color:#fff;font-size:1.55rem;font-weight:800;margin-top:22px;letter-spacing:-.01em}
.hero .sub{margin:2px 0 0;opacity:.9}
.live{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:.84rem;background:rgba(255,255,255,.1);padding:9px 12px;border-radius:12px}
.live i{width:8px;height:8px;border-radius:50%;background:#9FC2FF;margin-top:6px;flex:none}
.live.on i{background:#7CF0A8;box-shadow:0 0 0 4px rgba(124,240,168,.25)}
.live b{font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:-56px 16px 0;position:relative}
.stat{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 8px;background:var(--card);border:0;border-radius:16px;padding:14px;box-shadow:var(--sh);text-align:left}
.stat .ic{grid-row:span 2}
.stat small{font-size:.72rem;line-height:1.25;color:var(--text);font-weight:500}
.stat b{font-size:1.6rem;font-weight:800;color:var(--ink);line-height:1;grid-column:2}
.stat .chev{grid-row:1/3;grid-column:3;color:var(--muted)}
.mrow{display:flex;align-items:center;justify-content:space-between;margin:22px 18px 4px}
.mrow h2{font-size:1.15rem;font-weight:700}
.mrow small{color:var(--muted);font-size:.8rem;display:block;font-weight:500}
.iconb{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center}
.iconb svg{width:20px;height:20px}
.iconb:disabled{opacity:.3;cursor:default}

/* Íconos redondos */
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px}
.ic.fly{background:var(--fly-soft);color:var(--fly)}
.ic.ex{background:var(--ex-soft);color:var(--ex)}
.ic.rest{background:var(--rest-soft);color:var(--rest)}
.ic.res{background:color-mix(in srgb,var(--res) 14%,var(--card));color:var(--res)}
.ic.away{background:color-mix(in srgb,var(--away) 14%,var(--card));color:var(--away)}
.ic.blue{background:var(--blue-soft);color:var(--blue)}

/* Tira semanal */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:6px 12px 4px;text-align:center}
.wd{border:0;background:transparent;padding:4px 0 6px;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:12px}
.wd span{font-size:.74rem;color:var(--muted);font-weight:600}
.wd b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:var(--ink);font-size:.95rem}
.wd.today b{background:var(--blue);color:#fff}
.wd.sel b{box-shadow:0 0 0 2px var(--blue)}
.wd .dots{display:flex;gap:3px;height:5px}
.wd .dots i{width:5px;height:5px;border-radius:50%}
.wd .dots .f{background:var(--fly)} .wd .dots .e{background:var(--ex)}

/* Lista de días */
.dlist{list-style:none;margin:6px 0 0;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.drow{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start}
.dc{display:flex;flex-direction:column;align-items:flex-start;padding-top:10px}
.dc span{font-size:.78rem;color:var(--muted);font-weight:600}
.dc b{font-size:1.15rem;color:var(--ink);font-weight:700;line-height:1.2}
.dc em{font-style:normal;font-size:.66rem;font-weight:700;margin-top:4px;padding:1px 6px;border-radius:999px;color:var(--t);background:color-mix(in srgb,var(--t) 13%,transparent)}
.drow.now .dc span,.drow.now .dc b{color:var(--blue)}
.evs{display:flex;flex-direction:column;gap:8px;min-width:0}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;text-align:left;box-shadow:var(--sh)}
.ev .ic{grid-row:1}
.ev .tx{min-width:0}
.ev .tx b{display:block;color:var(--ink);font-weight:700;font-size:.95rem}
.ev .tx small{display:block;color:var(--text);font-size:.8rem;line-height:1.35}
.ev.muted{box-shadow:none;background:transparent;border-style:dashed}
.ev.muted .tx b{color:var(--muted);font-weight:600}
.strip{grid-column:1/-1;margin-top:8px;display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;color:var(--ink);background:var(--rest-soft);border-radius:10px;padding:7px 10px}
.strip svg{width:14px;height:14px;color:var(--rest)}
.strip.ex{background:var(--ex-soft)} .strip.ex svg{color:var(--ex)}
.bdg{font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;align-self:start}
.bdg.fly{background:var(--fly-soft);color:var(--fly);border:1px solid var(--fly-line)}
.bdg.ex{background:var(--ex-soft);color:var(--ex);border:1px solid var(--ex-line)}
.bdg.rest{background:var(--rest-soft);color:var(--rest)}
.bdg.done{background:var(--ex);color:#fff}
.bdg.res{background:color-mix(in srgb,var(--res) 14%,var(--card));color:var(--res)}
.bdg.away{background:color-mix(in srgb,var(--away) 14%,var(--card));color:var(--away)}
.bdg.miss{background:color-mix(in srgb,var(--warn) 12%,var(--card));color:var(--warn)}

/* Tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 16px 0;box-shadow:var(--sh)}
.card h3{font-size:1.02rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-size:.76rem;color:var(--muted);font-weight:600}
.sec{font-size:1.02rem;font-weight:700;margin:22px 18px 0;display:flex;justify-content:space-between;align-items:center}
.lead{color:var(--text);font-size:.86rem;margin:4px 0 0}
.note{color:var(--text);font-size:.84rem;margin:10px 0 0}
.empty{color:var(--muted);font-size:.86rem;margin:10px 0 0}
.warn{color:var(--warn);font-size:.84rem;font-weight:600;margin:8px 0 0}
.btn{border:0;background:var(--blue);color:var(--on-blue);font-weight:700;padding:12px 16px;border-radius:14px;font-size:.92rem}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.block{width:100%;display:block}
.btn.big{padding:14px 18px;font-size:1rem}
.row{display:flex;gap:10px;align-items:flex-end;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:.78rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--ink)}
textarea{min-height:84px;resize:vertical;margin-top:8px}
.saved{font-size:.76rem;color:var(--ex);font-weight:600;min-height:1em;margin-top:4px}
.rowlink{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px;margin-top:12px;text-align:left}
.rowlink .tx{flex:1}
.rowlink b{display:block;color:var(--ink);font-size:.92rem}
.rowlink small{color:var(--muted);font-size:.78rem}
.rowlink .chev{color:var(--muted)}
.chev svg{width:18px;height:18px;display:block}
.play{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:14px;height:14px}
.autotag{display:inline-block;margin-top:10px;font-size:.76rem;font-weight:600;color:var(--res);background:color-mix(in srgb,var(--res) 12%,var(--card));padding:4px 10px;border-radius:999px}
.tipline{margin:12px 0 0;font-size:.86rem;color:var(--text);background:var(--card2);border-radius:12px;padding:10px 12px;border-left:3px solid var(--blue)}
.banner{display:flex;gap:12px;align-items:flex-start}
.banner p{margin:4px 0 0;font-size:.86rem}

/* Detalle del día */
.dtitle{font-size:1.05rem;font-weight:700;margin:6px 18px 0}
.fcard{margin:14px 16px 0;border-radius:18px;background:var(--fly-soft);border:1px solid var(--fly-line);overflow:hidden}
.fhead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:16px;align-items:start}
.fhead .ic{background:var(--card);color:var(--fly);width:48px;height:48px}
.fhead b{display:block;color:var(--ink);font-size:1.05rem}
.fhead > div span{display:block;font-size:.86rem;color:var(--text)}
.fbody{background:var(--card);padding:4px 16px 12px}
.frow{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.frow:last-of-type{border-bottom:0}
.frow svg{width:24px;height:24px;color:var(--muted);flex:none}
.frow small{display:block;color:var(--muted);font-size:.8rem}
.frow b{color:var(--ink);font-weight:600}
.legs{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.legs li{font-size:.76rem;font-weight:600;background:var(--fly-soft);color:var(--fly);padding:4px 9px;border-radius:999px}
.kcard{margin:14px 16px 0;border-radius:18px;padding:16px;background:color-mix(in srgb,var(--t) 9%,var(--card));border:1px solid color-mix(in srgb,var(--t) 25%,var(--line))}
.kcard b{color:var(--t);font-size:.95rem}
.kcard p{margin:6px 0 0;font-size:.88rem}
.pch{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.pch b{display:block;color:var(--ink);font-size:1rem}
.pch small{color:var(--muted);font-size:.8rem}
.insp{margin:14px 16px 0;border-radius:18px;background:linear-gradient(180deg,var(--card),var(--blue-soft));border:1px solid var(--line);padding:18px 18px 0;overflow:hidden}
.insp-t{display:flex;gap:10px;align-items:flex-start}
.insp-t svg{width:26px;height:26px;color:#F5A524;flex:none}
.insp h3{font-size:1.02rem;line-height:1.3}
.insp p{font-size:.86rem;margin:10px 0 0 36px}
.insp .win{display:block;width:100%;height:auto;margin-top:10px}

/* Entrenamiento */
.pbar{height:9px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .4s}
.pcap{text-align:center;font-size:.76rem;color:var(--text);font-weight:600;margin:6px 0 0}
.circles{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;text-align:center}
.circles button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0}
.circles span{font-size:.78rem;font-weight:600;color:var(--ink);width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.circles .sel span{background:var(--ex-soft);color:var(--ex)}
.cir{width:36px;height:36px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;color:var(--muted);background:var(--card)}
.cir svg{width:18px;height:18px}
.cir.done{background:var(--ex);border-color:var(--ex);color:#fff}
.cir.fly{background:var(--fly);border-color:var(--fly);color:#fff}
.cir.flyr{border-color:var(--fly);color:var(--fly)}
.cir.rest{background:var(--rest-soft);border-color:var(--rest-soft);color:var(--rest)}
.cir.miss{border-color:var(--warn);color:var(--warn);font-weight:700}
.cir.today{box-shadow:0 0 0 3px var(--blue-soft);border-color:var(--blue)}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:.76rem;color:var(--text)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chk{list-style:none;margin:10px 0 0;padding:0}
.chk li{border-top:1px solid var(--line)}
.chk li:first-child{border-top:0}
.chk button{display:flex;gap:12px;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;padding:11px 0}
.chk .bx{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--line2);flex:none;display:grid;place-items:center;color:transparent;margin-top:1px;transition:background .15s}
.chk .bx svg{width:14px;height:14px}
.chk [aria-pressed="true"] .bx{background:var(--blue);border-color:var(--blue);color:#fff}
.chk [aria-pressed="true"] b{text-decoration:line-through;text-decoration-color:var(--muted)}
.chk b{display:block;color:var(--ink);font-weight:600;font-size:.92rem}
.chk small{display:block;color:var(--muted);font-size:.78rem;margin-top:1px}
.cheer{display:flex;gap:12px;align-items:center;background:var(--ex-soft);border-radius:14px;padding:12px 14px;margin-top:12px}
.cheer svg{width:28px;height:28px;color:var(--ex);flex:none}
.cheer b{color:var(--ink);display:block;font-size:.92rem}
.cheer small{font-size:.8rem;color:var(--text)}

/* Detalle de entrenamiento */
.rtitle{margin:4px 18px 0}
.rtitle h2{font-size:1.25rem;font-weight:800}
.rtitle p{margin:2px 0 0;color:var(--muted);font-size:.86rem}
.exl{list-style:none;margin:6px 0 0;padding:0}
.exr{display:grid;grid-template-columns:40px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.exr:first-child{border-top:0}
.gly{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--ink)}
.gly svg{width:24px;height:24px}
.exi b{display:block;color:var(--ink);font-size:.93rem;font-weight:600}
.exi .cr{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.exs{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.vol{font-weight:700;color:var(--ink);font-size:.9rem;white-space:nowrap}
.vol small{display:block;text-align:right;color:var(--muted);font-weight:500;font-size:.74rem}
.exck{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--line2);background:var(--card);display:grid;place-items:center;color:transparent;padding:0}
.exck svg{width:15px;height:15px}
.exck[aria-pressed="true"]{background:var(--ex);border-color:var(--ex);color:#fff}
.exr.done .exi b{color:var(--muted)}
.kgs{display:inline-flex;align-items:center;margin-top:8px;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.kgs button{border:0;background:var(--card2);width:34px;height:34px;font-weight:700;color:var(--blue)}
.kgs input{width:62px;border:0;border-radius:0;text-align:center;padding:6px 4px;font-weight:600}
.kgs::after{content:"kg";font-size:.74rem;color:var(--muted);padding:0 8px 0 2px}
.wlist{margin:8px 0 0;padding-left:18px;font-size:.86rem}
.wlist li{margin:4px 0}
.tipbox{display:flex;gap:10px;margin:14px 16px 0;background:var(--blue-soft);border-radius:16px;padding:14px;font-size:.86rem;color:var(--text)}
.tipbox svg{width:22px;height:22px;color:var(--blue);flex:none}
.tipbox p{margin:0}
.tipbox p+p{margin-top:6px}
.crono{display:flex;flex-direction:column;gap:12px;align-items:stretch;background:var(--card2);border-radius:16px;padding:16px;margin-top:12px;text-align:center}
.cdisp span{display:block;font-size:2.6rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.cdisp small{color:var(--muted);font-size:.82rem}
.crono.rest .cdisp span{color:var(--rest)}

  for (const [k,v] of Object.entries(S.sched)) if (v) m[k] = v;
  days = {}; duties = [];

    if (x.type==="vuelo"){ const d = Object.assign({}, x, {s:new Date(x.s), e:new Date(x.e)}); duties.push(d); days[x.date] = {type:"vuelo", duty:d}; }

  }
  duties.sort((a,b) => a.s-b.s);
  lastKey = Object.keys(m).sort().at(-1) || "";
  PLAN = {};
  for (let ws=PLAN_START; ws<=PLAN_END; ws=addD(ws,7)){
    const wk = [];
    for (let i=0;i<7;i++){ const s = addD(ws,i); if (s<=PLAN_END) wk.push({s, key:WEEK[i], orig:WEEK[i]}); }
    const out = [];
    wk.forEach(d => { if (SESS[d.key].type!=="descanso" && heavy(d.s)){ d.key = "P"; d.auto = "out"; out.push(d); } });
    out.forEach(o => {
      const t = wk.find(d => d.s>o.s && d.key==="R" && !d.auto && !heavy(d.s));
      if (t){ t.key = o.orig; t.auto = "in"; t.from = o.s; o.to = t.s; }

/* Utilidades de vista */
const isTrain = p => !!p && p.type!=="descanso" && p.key!=="P";
const weekStart = s => addD(PLAN_START, Math.floor(diffD(PLAN_START,s)/7)*7);
const INI = ["L","M","M","J","V","S","D"];
const ini = s => INI[wd(s)];
const dnum = s => Number(s.slice(8));
const chain = d => [d.legs[0].split("-")[0], ...d.legs.map(l=>l.split("-")[1])].join(" → ");
const durTxt = d => { const m = Math.round((d.e-d.s)/60000); return `${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")} min`; };
const endTxt = d => d.est ? "madrugada" : d.d + (ymd(d.e)!==ymd(d.s) ? " (+1)" : "");
const startTxt = d => d.r.replace(" del ", " (") + (d.r.includes(" del ") ? ")" : "");
const timeTxt = d => `${startTxt(d)} - ${endTxt(d)}`;
const wdLong = s => cap(new Intl.DateTimeFormat("es-CL",{timeZone:TZ,weekday:"long"}).format(noon(s)));
const range = (a,b) => a.slice(0,7)===b.slice(0,7) ? `${dnum(a)} - ${fDM.format(noon(b))}` : `${fDM.format(noon(a))} - ${fDM.format(noon(b))}`;
const bar = (title, right="", noBack=false) => `<header class="bar">${noBack?"":`<button type="button" class="backb" data-back aria-label="Volver">${FI.left}</button>`}<h1>${title}</h1>${right}</header>`;
const chev = `<span class="chev">${FI.right}</span>`;
function nextTrain(s, incl){
  for (let i = incl?0:1; i<=21; i++){ const d = addD(s,i), p = planned(d); if (isTrain(p) && p.auto!=="out") return [d,p]; }
  return null;
}
function weekDays(ws){
  const t = today(); let comp = 0; const out = [];
  for (let i=0;i<7;i++){
    const s = addD(ws,i), p = planned(s), r = getDay(s), it = info(s); let st = "none", ic = "";
    if (isTrain(p)){
      if (r.st==="hecha" || r.st==="parcial"){ st = "done"; ic = CHECK; comp++; }
      else if (r.st==="saltada"){ st = "miss"; ic = "×"; }
      else if (it.type==="vuelo"){ st = "flyr"; ic = FI.plane; }
    } else if (p && p.key==="P"){ st = "fly"; ic = FI.plane; if (s<t) comp++; }
    else if (p){ st = "rest"; ic = FI.moon; if (s<t) comp++; }
    out.push({s, st, ic});
  }
  return {comp, out};
}

/* Fila de un día (Inicio y Calendario semanal) */
function dayRow(s){
  const i = info(s), p = planned(s), rec = getDay(s), t = today();
  let cards = "", tag = "";
  if (i.type==="vuelo"){
    const d = i.duty;
    let strip = "", sc = "";
    if (ymd(d.s)!==s) strip = "Descanso (llegada)";
    else if (p && p.key==="P") strip = "Recuperación activa: pasos o caminata";
    else if (p && p.type==="descanso") strip = "Descanso (viaje)";
    else if (lastDest(d)!=="SCL") strip = `Pernoctas en ${city(lastDest(d))}`;
    cards += `<button type="button" class="ev" data-nav="dia" data-s="${s}"><span class="ic fly">${FI.plane}</span><span class="tx"><b>Vuelo</b><small>${chain(d)}</small><small>${timeTxt(d)}</small></span><span class="bdg fly">Vuelo</span>${strip?`<span class="strip${sc}">${p && p.key==="P" ? FI.walk : FI.moon}${strip}</span>`:""}</button>`;
  } else if (i.type==="fuera"){
    cards += `<button type="button" class="ev" data-nav="dia" data-s="${s}"><span class="ic away">${FI.bed}</span><span class="tx"><b>Fuera de casa</b><small>${i.place?`Todo el día en ${city(i.place)}`:"Pernoctas fuera de Santiago"}</small></span><span class="bdg away">Pernocta</span></button>`;
  } else if (i.type==="blanco"){
    cards += `<button type="button" class="ev" data-nav="dia" data-s="${s}"><span class="ic res">${FI.bell}</span><span class="tx"><b>Día B</b><small>Te pueden asignar hasta las 21:00 de la víspera</small></span><span class="bdg res">Día B</span></button>`;
  } else if (i.type==="libre") tag = `<em style="--t:var(--off)">Libre</em>`;
  else if (i.type==="tierra") tag = `<em style="--t:var(--ground)">DH</em>`;

  if (isTrain(p) && p.auto!=="out"){
    const done = rec.st==="hecha" || rec.st==="parcial";
    const sub = rec.st ? LBL[rec.st] : p.auto==="in" ? "Movida por un vuelo" : `Semana ${weekOf(s)} de ${PLAN_WEEKS}, día ${dayOf(s)}`;
    const bd = done ? `<span class="bdg done">${rec.st==="hecha"?"Hecha":"Parcial"}</span>` : rec.st==="saltada" ? `<span class="bdg miss">No la hice</span>` : `<span class="bdg ex">Ejercicio</span>`;
    cards += `<button type="button" class="ev" data-nav="ent" data-s="${s}"><span class="ic ex">${FI.dumb}</span><span class="tx"><b>Entrenamiento</b><small>${p.name}</small><small>${sub}</small></span>${bd}</button>`;
  } else if (p && p.type==="descanso" && i.type!=="vuelo"){
    cards += `<button type="button" class="ev" data-nav="dia" data-s="${s}"><span class="ic rest">${FI.moon}</span><span class="tx"><b>Descanso</b><small>Recuperación completa. Prioriza dormir bien.</small></span><span class="bdg rest">Descanso</span></button>`;
  } else if (!p && !cards){
    cards += `<button type="button" class="ev muted" data-nav="dia" data-s="${s}"><span class="tx"><b>${i.type==="sininfo" ? "Sin programación cargada" : "Fuera del bloque"}</b><small>${s<PLAN_START ? `El plan parte el ${fDM.format(noon(PLAN_START))}` : `El bloque terminó el ${fDM.format(noon(PLAN_END))}`}</small></span></button>`;
  }
  return `<li class="drow${s===t?" now":""}"><div class="dc"><span>${s===t?"Hoy":wdn(s)}</span><b>${dnum(s)}</b>${tag}</div><div class="evs">${cards}</div></li>`;
}
function stripHtml(ws, sel){
  let h = "";
  for (let i=0;i<7;i++){
    const s = addD(ws,i), it = info(s), p = planned(s);
    h += `<button type="button" class="wd${s===today()?" today":""}${s===sel?" sel":""}" data-nav="dia" data-s="${s}" aria-label="${esc(cap(fDay.format(noon(s))))}"><span>${ini(s)}</span><b>${dnum(s)}</b><i class="dots">${it.type==="vuelo"?`<i class="f"></i>`:""}${isTrain(p)&&p.auto!=="out"?`<i class="e"></i>`:""}</i></button>`;
  }
  return `<div class="wstrip">${h}</div>`;
}

/* Cierres */
function dayCloseHtml(){
  const now = new Date(), t = ymd(now);
  if (+fHour.format(now) < 20) return "";
  const rec = getDay(t), sess = planned(t), miss = [];
  if (isTrain(sess) && sess.auto!=="out" && !rec.st) miss.push("Marcar el entrenamiento de hoy");
  HKEYS.forEach(k => { if (!habDone(rec,k)) miss.push({agua:"Agua: llegar a 4 L",prot:"Proteína: registrar o completar 200 g",kcal:"Calorías: registrar el día",pasos:"Pasos: anotar los del reloj",azucar:"Sin azúcar refinada",sueno:"Registrar cómo dormiste"}[k]); });
  return `<div class="card"><h3>Cierre del día <small>${miss.length ? `${miss.length} pendientes` : "Completo"}</small></h3>
    ${miss.length ? `<ul class="miss">${miss.map(m=>`<li>${m}</li>`).join("")}</ul><button type="button" class="linkish" data-nav="nut">Ir a Nutrición y hábitos ›</button>` : `<span class="done-lbl">${CHECK.replace("<svg ","<svg width=\"14\" height=\"14\" ")}Todo registrado. Buen día.</span>`}</div>`;
}
function weekStats(ws){
  let p=0, c=0, hb=0;
  for (let i=0;i<7;i++){ const s = addD(ws,i), ss = planned(s), r = getDay(s);
    if (isTrain(ss) && ss.auto!=="out"){ p++; c += r.st==="hecha"?1:r.st==="parcial"?.5:0; }
    hb += habCount(r); }
  const ws2 = weights(), end = addD(ws,6);
  const a = ws2.filter(w => w[0]<ws).at(-1), b = ws2.filter(w => w[0]>=ws && w[0]<=end).at(-1);
  return {p, c, hp:Math.round(hb/(7*HKEYS.length)*100), sp:p?Math.round(c/p*100):0, dw: a&&b ? b[1]-a[1] : null};
}
function weekCloseHtml(){
  const t = today(), w0 = weekStart(t), k = diffD(w0,t); let ws = null;
  if (k===6) ws = w0; else if (k===0) ws = addD(w0,-7);
  if (!ws || ws<PLAN_START || ws>PLAN_END || (k===0 && S.weeks[ws]?.done)) return "";
  const st = weekStats(ws), wk = S.weeks[ws] || {};
  return `<div class="card" data-w="${ws}">

    <div class="close-stats">
      <div class="kpi"><span>Sesiones</span><b>${st.c.toLocaleString("es-CL")}/${st.p}</b></div>
      <div class="kpi"><span>Hábitos</span><b>${st.hp}%</b></div>
      <div class="kpi"><span>Peso</span><b style="color:${st.dw==null?"var(--ink)":st.dw<=0?"var(--ex)":"var(--warn)"}">${st.dw==null?"–":`${st.dw>0?"+":""}${kg(st.dw)}`}</b></div>
    </div>
    <div class="fld"><label for="wk-${ws}">¿Qué cambias la próxima semana?</label><textarea id="wk-${ws}" data-act="wk" placeholder="Una cosa concreta: dejar el bolso del gimnasio listo, llevar proteína al vuelo…">${esc(wk.txt)}</textarea></div>
    ${wk.done ? `<span class="done-lbl">${CHECK.replace("<svg ","<svg width=\"14\" height=\"14\" ")}Semana cerrada</span>` : `<button type="button" class="btn block" data-act="wkclose" style="margin-top:12px">Cerrar semana</button>`}
  </div>`;

/* ---------- Inicio ---------- */
function vInicio(){
  const now = new Date(), t = ymd(now), base = t<PLAN_START ? PLAN_START : t, ws = weekStart(base), we = addD(ws,6), st = status(now);
  let fl = 0, ex = 0;
  for (let i=0;i<7;i++){ const s = addD(ws,i); if (info(s).type==="vuelo") fl++; const p = planned(s); if (isTrain(p) && p.auto!=="out") ex++; }
  const list = []; for (let s=t; (s<=we || list.length<4) && list.length<8; s=addD(s,1)) list.push(s);
  const nx = duties.find(d => d.s>now && !(st.live && d===st.duty));
  const wn = weekOf(base), inB = wn>=1 && wn<=PLAN_WEEKS;
  let pre = "";
  if (t<PLAN_START){ const p1 = planned(PLAN_START);
    pre = `<div class="card banner"><span class="ic blue">${FI.cal}</span><div><b style="color:var(--ink)">${diffD(t,PLAN_START)===1?"Mañana":"El "+fDM.format(noon(PLAN_START))} parte tu bloque</b><p>${cap(fDay.format(noon(PLAN_START)))} es el día 1 de la semana 1: ${p1?p1.name.toLowerCase():"entrenamiento"}. Cada semana dura 7 días desde ahí, de jueves a miércoles.</p></div></div>`; }
  return `<header class="hero">
    <div class="brand"><span class="logo">${FI.plane}</span><div><b>FlyFit</b><small>Vuelos + Bienestar</small></div><button type="button" class="avatar" data-nav="mas" aria-label="Más opciones">${FI.user}</button></div>

    <div class="live${st.live?" on":""}"><i></i><span><b>${st.label}.</b> ${st.where}${nx && !st.live ? ` Próximo vuelo ${until(nx.s-now)}.` : ""}</span></div>
  </header>
  <div class="stats">
    <button type="button" class="stat" data-nav="cal"><span class="ic fly">${FI.plane}</span><small>Vuelos esta semana</small><b>${fl}</b><span class="chev">${FI.right}</span></button>
    <button type="button" class="stat" data-nav="ent"><span class="ic ex">${FI.dumb}</span><small>Días de ejercicio</small><b>${ex}</b><span class="chev">${FI.right}</span></button>
  </div>
  ${pre}
  <div class="mrow"><div><h2>${monthLabel(base.slice(0,7))}</h2><small>${inB ? `Semana ${wn} de ${PLAN_WEEKS}, ${sh(ws)} al ${sh(we)}` : "Fuera del bloque de 4 semanas"}</small></div><button type="button" class="iconb" data-nav="cal" aria-label="Abrir calendario">${FI.right}</button></div>
  ${stripHtml(ws, null)}
  <ul class="dlist">${list.map(dayRow).join("")}</ul>
  ${dayCloseHtml()}${weekCloseHtml()}`;
}

    body = `<div class="wnav"><button type="button" class="iconb" data-act="wk7" data-v="-1" aria-label="Semana anterior">${FI.left}</button><div><b>${range(calWs,we)}</b><small>${wn>=1&&wn<=PLAN_WEEKS?`Semana ${wn} de ${PLAN_WEEKS}`:"Fuera del bloque"}</small></div><button type="button" class="iconb" data-act="wk7" data-v="1" aria-label="Semana siguiente">${FI.right}</button></div>

  } else {
    const first = `${curM}-01`, nm = `${nextM(curM)}-01`, start = monday(first), lastD = addD(nm,-1), end = addD(lastD, 6-wd(lastD));

    for (let k=start; k<=end; k=addD(k,1)){

      const lbl = `${fDay.format(noon(k))}: ${KIND[i.type]}${p?`, ${p.name}`:""}`;

}

/* ---------- Detalle del día ---------- */
function restRec(s, d){
  if (ymd(d.s)!==s) return "Duerme apenas llegues";

  return "Al menos 8 h al llegar";
}
function nextActTxt(s){

  const n = nextTrain(s, false);
  const r = p && p.key==="P" ? "Recuperación activa" : "Descanso (viaje)";
  return n ? `${r}. Luego ${n[1].name.toLowerCase()}, ${wdn(n[0]).toLowerCase()} ${dnum(n[0])}` : r;
}

      <div class="fbody">

    const bd = tr ? `<span class="bdg ex">Ejercicio</span>` : `<span class="bdg rest">Descanso</span>`;

function an(p){ const x = autoNote(p); return x ? `<span class="autotag">${x}</span>` : ""; }

/* ---------- Detalle de entrenamiento ---------- */
function vRut(s){
  const p = planned(s);
  if (!p || !p.rt) return `${bar("Detalle de entrenamiento")}<div class="card"><p class="empty" style="margin:0">Este día no tiene una rutina de Coke.</p></div>`;
  const r = ROUT[p.rt], w = rwk(s), rec = getDay(s), ex = rec.ex || {};
  const nDone = r.ex.filter(e => ex[e.id]?.done).length;
  const rows = r.ex.map(e => {
    const [vol, load, crit] = e.w[w-1], name = Array.isArray(e.n) ? e.n[w-1] : e.n, st = ex[e.id] || {};
    const hasKg = /kg/.test(load) && !r.circuit, prev = hasKg ? lastOf(s, d => d.ex?.[e.id]?.kg) : null;
    return `<li class="exr${st.done?" done":""}"><span class="gly">${GL[GLY[e.id]]||GL.sq}</span>
      <div class="exi"><b>${esc(name)}</b><span class="cr">${crit}${prev?` Última vez: ${esc(prev[1])} kg.`:""}</span>
        ${hasKg ? `<div class="kgs"><button type="button" data-act="kgstep" data-v="${e.id}" data-n="-2.5" aria-label="Bajar 2,5 kg">−</button><input type="text" inputmode="decimal" class="exkg" data-act="exkg" data-v="${e.id}" value="${esc(st.kg??"")}" placeholder="${(load.match(/[\d,]+/)||[""])[0]}" aria-label="Kilos usados en ${esc(name)}"><button type="button" data-act="kgstep" data-v="${e.id}" data-n="2.5" aria-label="Subir 2,5 kg">+</button></div>` : ""}</div>
      <div class="exs"><span class="vol">${vol}<small>${load ? (load==="PC"?"peso corporal":load) : ""}</small></span><button type="button" class="exck${pop(`${s}:ex:${e.id}`)}" data-act="exdone" data-v="${e.id}" aria-pressed="${!!st.done}" aria-label="${esc(name)} hecho">${CHECK}</button></div></li>`;
  }).join("");
  let laps = "";
  if (r.circuit){
    const L = rec.laps || [], prev = lastOf(s, d => (d.laps||[]).some(x=>x) ? d.laps : null);
    const tot = L.map(parseT).filter(x=>x!=null), ptot = prev ? prev[1].map(parseT).filter(x=>x!=null) : [];
    const sum = a => a.reduce((x,y)=>x+y,0);
    laps = `<h3 class="sec">Circuito: 5 vueltas</h3><div class="card">${cronoHtml(s)}
      <div class="laps">${[0,1,2,3,4].map(i => { const a = parseT(L[i]), b = prev ? parseT(prev[1][i]) : null;
        return `<div class="lap${a!=null?" set":""}"><label for="lap-${s}-${i}">V${i+1}</label><input id="lap-${s}-${i}" type="text" inputmode="numeric" data-act="lap" data-v="${i}" value="${esc(L[i]??"")}" placeholder="${b!=null?fmtT(b):"0:00"}">${a!=null&&b!=null?`<small class="${a<=b?"up":"dn"}">${a<=b?"−":"+"}${fmtT(Math.abs(a-b))}</small>`:""}</div>`; }).join("")}</div>
      <p class="note" data-laptot>${tot.length ? `Total ${fmtT(sum(tot))}${ptot.length===tot.length ? (sum(tot)<=sum(ptot) ? `, ${fmtT(sum(ptot)-sum(tot))} más rápido que el ${sh(prev[0])}` : `, ${fmtT(sum(tot)-sum(ptot))} más lento que el ${sh(prev[0])}`) : ""}.` : "Usa el cronómetro o escribe cada vuelta. Descanso de 1:30 min entre vueltas."}</p><p class="note"><b>Objetivo de Coke:</b> registrar el mejor tiempo posible manteniendo una buena técnica. El circuito no cambia en las 4 semanas.</p></div>`;
  }
  return `${bar("Detalle de entrenamiento")}<div data-d="${s}"><div class="routine">
    <div class="rtitle"><h2>${p.name}</h2><p>${cap(fDay.format(noon(s)))}. Semana ${w} de ${PLAN_WEEKS}: ${r.weeks[w-1]}.</p></div>
    <div class="card"><h3>Calentamiento</h3><ul class="wlist">${WARM.map(([a,b])=>`<li><b>${a}.</b> ${b}</li>`).join("")}<li><b>Activación.</b> ${r.act}</li></ul></div>
    <h3 class="sec">Ejercicios <small style="font-size:.78rem;color:var(--muted);font-weight:600">${nDone} de ${r.ex.length}</small></h3>
    <div class="card"><ul class="exl">${rows}</ul></div>
    ${laps}
    <h3 class="sec">Registro</h3>
    <div class="card">${p.auto==="out" ? `<p class="empty" style="margin:0">Hoy toca recuperación activa por el vuelo.</p>` : segHtml(s, rec.st||"")}${fieldsHtml(s,p)}</div>
    <div class="tipbox">${FI.bulb}<div><p>Tip: mantén una buena hidratación y escucha a tu cuerpo. Si estás muy cansado por el vuelo, puedes reducir un poco la intensidad.</p><p>${esc(adaptFor(s,p))}</p></div></div>
  </div></div>`;
}

let progTab = "sem";
function chart(ws){
  const W=340,H=190,L=34,R2=12,Tp=12,B=26, x0=noon("2026-08-10"), x1=noon("2027-01-31");
  const ys = ws.map(w=>w[1]); const ymin = Math.min(82, Math.floor(Math.min(...ys)-1)), ymax = Math.max(100, Math.ceil(Math.max(...ys)+1));
  const X = s => L + (noon(s)-x0)/(x1-x0)*(W-L-R2), Y = v => Tp + (ymax-v)/(ymax-ymin)*(H-Tp-B);
  let g = "";
  for (let v=Math.ceil(ymin/5)*5; v<=ymax; v+=5) g += `<line x1="${L}" x2="${W-R2}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+3.5}" text-anchor="end">${v}</text>`;
  [["2026-08-22","ago"],["2026-09-15","sep"],["2026-10-15","oct"],["2026-11-15","nov"],["2026-12-15","dic"],["2027-01-15","ene"]].forEach(([s,l]) => g += `<text x="${X(s)}" y="${H-8}" text-anchor="middle">${l}</text>`);
  g += `<rect x="${X(PLAN_START)}" y="${Tp}" width="${X(PLAN_END)-X(PLAN_START)}" height="${H-Tp-B}" fill="var(--blue)" opacity=".07"/>`;
  g += `<line x1="${L}" x2="${W-R2}" y1="${Y(W_GOAL)}" y2="${Y(W_GOAL)}" stroke="var(--ex)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R2}" y="${Y(W_GOAL)-6}" text-anchor="end" style="fill:var(--ex)">Meta ${W_GOAL} kg</text>`;
  if (ws.length>=3){
    const ma = ws.map((w,i) => { const a = ws.slice(Math.max(0,i-2), i+1); return [w[0], a.reduce((s,x)=>s+x[1],0)/a.length]; });
    g += `<polyline points="${ma.map(([s,v])=>`${X(s).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--blue)" stroke-opacity=".25" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  g += `<polyline points="${ws.map(([s,v])=>`${X(s).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>`;
  g += ws.map(([s,v]) => `<circle cx="${X(s)}" cy="${Y(v)}" r="3.4" fill="var(--card)" stroke="var(--blue)" stroke-width="2"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de peso frente a la meta de ${W_GOAL} kg; la franja marca el bloque actual">${g}</svg>`;
}

let R = {v:"inicio"}, HIST = [], prevTab = "inicio";
const TABS = [["inicio","Inicio",FI.home],["cal","Calendario",FI.cal],["ent","Entrenamiento",FI.dumb],["nut","Nutrición",FI.apple],["mas","Más",FI.more]];
const TAB_OF = {inicio:"inicio",cal:"cal",dia:"cal",ent:"ent",rut:"ent",nut:"nut",prog:"mas",mas:"mas"};
$("#tabs").innerHTML = TABS.map(([k,l,i]) => `<button type="button" data-nav="${k}" data-tab>${i}<span>${l}</span></button>`).join("");
function render(force){
  const a = document.activeElement;
  if (!force && a && a.matches("#view textarea, #view input, #view select")) return;
  const v = R.v;
  $("#view").innerHTML = v==="inicio" ? vInicio() : v==="cal" ? vCal() : v==="dia" ? vDia(R.s) : v==="ent" ? vEnt() : v==="rut" ? vRut(R.s) : v==="nut" ? vNut() : v==="prog" ? vProg() : vMas();
  document.body.dataset.v = v;
  document.querySelectorAll("#tabs [data-tab]").forEach(b => b.dataset.nav===TAB_OF[v] ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  popKey = null; showSync();
}
const rerender = render;
function nav(v, s){
  if (!(R.v===v && R.s===s)) HIST.push(R);
  if (HIST.length>30) HIST.shift();
  R = {v, s}; render(true); window.scrollTo({top:0});
}
function back(){ R = HIST.pop() || {v:"inicio"}; render(true); window.scrollTo({top:0}); }
function go(t){ nav(t==="aj" ? "mas" : t==="hoy" ? "inicio" : t); }
document.addEventListener("click", e => {
  const n = e.target.closest("[data-nav]");
  if (n){
    const v = n.dataset.nav, s = n.dataset.s;
    if (v==="ent") entSel = s || null;
    if (v==="nut") nutSel = s || null;
    if (n.hasAttribute("data-tab")){ HIST = []; R = {v}; calWs = null; curM = null; render(true); window.scrollTo({top:0}); return; }
    return nav(v, s);
  }
  if (e.target.closest("[data-back]")) return back();
  const b = e.target.closest("[data-act]"); if (!b || ["INPUT","TEXTAREA","SELECT"].includes(b.tagName)) return;
  const a = b.dataset.act, v = b.dataset.v, s = b.closest("[data-d]")?.dataset.d;
  switch(a){
    case "calmode": calMode = v; break;
    case "wk7": calWs = addD(calWs, 7*(+v)); break;
    case "mon": curM = +v>0 ? nextM(curM) : prevM(curM); break;
    case "entday": entSel = v; break;
    case "nutd": { const x = addD(nutSel||today(), +v); nutSel = x>today() ? today() : x; break; }
    case "progtab": progTab = v; break;
    case "wu": case "actv": { const r = getDay(s); setDay(s, {[a]: !r[a]}); break; }
    case "ml": { const r = getDay(s), ml = Object.assign({}, r.ml); ml[v] = !ml[v]; setDay(s, {ml}); break; }
    default: return;
  }
  render(true);
});

/* Respaldo: exportar e importar */
async function saveFile(name, data, mime){
  try {
    if (DL){ await DL.save({filename:name, data}); }
    else {
      const url = URL.createObjectURL(new Blob([data], {type:mime+";charset=utf-8"}));
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    toast("Archivo descargado");
  } catch(err){ if (err?.code!=="declined") toast("No se pudo descargar el archivo."); }
}
async function importBackup(file){
  try {
    const j = JSON.parse(await file.text()), d = j && j.app==="flyfit" ? j.data : null;
    if (!d || typeof d!=="object") throw 0;
    let n = 0;
    for (const k of Object.keys(PFX)){
      const src = d[k]; if (!src || typeof src!=="object") continue;
      for (const [key,val] of Object.entries(src)){ if (val==null) continue; S[k][key] = val; save(k, key); n++; }
    }
    rebuild(); render(true);
    toast(n ? `Respaldo importado: ${n} registros` : "El respaldo no tenía registros");
  } catch(e){ toast("Ese archivo no es un respaldo de FlyFit."); }
}
document.addEventListener("change", e => { const el = e.target; if (el.dataset?.act==="bkimp" && el.files?.[0]) importBackup(el.files[0]); });

/* Eventos */
function noteSaved(el){ const sv = el.parentElement.querySelector(".saved"); if (!sv) return; sv.textContent = "Guardado"; clearTimeout(sv._t); sv._t = setTimeout(()=>sv.textContent="",1500); }
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n) ? Math.round(n*10)/10 : null; };
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b || ["INPUT","TEXTAREA","SELECT"].includes(b.tagName)) return;
  const a = b.dataset.act, s = b.closest("[data-d]")?.dataset.d, rec = s ? getDay(s) : null, v = b.dataset.v;
  switch(a){
    case "import": return openImport();
    case "impclose": return closeImport();
    case "impread": return impRead();
    case "impback": imp.state = "form"; return renderImp();
    case "impsave": {
      imp.arr.forEach(x => { S.sched[x.date] = x; save("sched", x.date); });
      rebuild(); closeImport(); curM = imp.m;
      toast(`Programación de ${monthLabel(imp.m).toLowerCase()} guardada`); return rerender(true);
    }
    case "goaj": return go("aj");
    case "ajback": return go(prevTab);
    case "full": fullView.add(s); break;
    case "st": { const nv = rec.st===v ? "" : v; popKey = `${s}:st:${nv}`; setDayUndo(s, {st:nv}, nv ? `Sesión: ${LBL[nv].toLowerCase()}` : "Estado quitado"); break; }
    case "rpe": { const x = rec.rpe==null ? 6 : Math.max(1, Math.min(10, rec.rpe + +v)); setDay(s, {rpe:x}); break; }
    case "rpe0": setDay(s, {rpe:null}); break;
    case "dur": setDay(s, {min: rec.min===+v ? null : +v}); break;
    case "rpev": setDay(s, {rpe: rec.rpe===+v ? null : +v}); break;
    case "kgstep": {
      const ex = JSON.parse(JSON.stringify(rec.ex||{})), inp = b.parentElement.querySelector("input");
      const base = kgNum(ex[v]?.kg) ?? kgNum(inp?.placeholder) ?? 0, nv = Math.max(0, base + +b.dataset.n);
      ex[v] = Object.assign({}, ex[v], {kg: kgFmt(nv)}); setDay(s, {ex}); if (inp) inp.value = kgFmt(nv); return;
    }
    case "vaso": {
      const n = Object.assign({}, rec.n), g = Math.floor((n.agua||0)/500), i = +v;
      n.agua = (i+1)===g ? i*500 : (i+1)*500;
      setDayUndo(s, {n}, `Agua: ${lt(n.agua)} L`); refreshHab(b.closest(".habcard"), s); return;
    }
    case "sueno": {
      const n = Object.assign({}, rec.n), h = Object.assign({}, rec.h);
      if (n.sueno===+v) { delete n.sueno; h.sueno = false; } else { n.sueno = +v; h.sueno = +v>=4; }
      popKey = `${s}:sl:${v}`; setDay(s, {n, h}); break;
    }
    case "sugar": {
      const h = Object.assign({}, rec.h); h.azucar = !h.azucar;
      setDayUndo(s, {h}, h.azucar ? "Sin azúcar: listo" : "Sin azúcar: desmarcado");
      b.setAttribute("aria-checked", h.azucar); refreshHab(b.closest(".habcard"), s); return;
    }
    case "cstart": CRONO = {s, run:true, t0:Date.now(), rest:0}; return replaceCrono(s);
    case "cstop": CRONO = {s:null, run:false, t0:0, rest:0}; return replaceCrono(s);
    case "clap": {
      const c = cronoState(s); if (c.mode!=="run") return;
      const secs = Math.round((Date.now()-CRONO.t0)/1000), L = [...(rec.laps||["","","","",""])];
      L[c.n] = fmtT(secs); CRONO = {s, run:false, t0:0, rest: c.n<4 ? Date.now()+90000 : 0};
      setDay(s, {laps:L}); try { navigator.vibrate?.(40); } catch(e){}
      toast(`Vuelta ${c.n+1}: ${fmtT(secs)}`); break;
    }
    case "wstep": { const el = $("#wKg"), x = num(el.value) ?? weights().at(-1)[1]; el.value = kg(Math.max(30, Math.round((x + +b.dataset.n)*10)/10)); return; }
    case "theme": { S.cfg.ui = {theme:v}; save("cfg","ui"); try { localStorage.setItem("bitacora-theme", v); } catch(e){} applyTheme(); break; }
    case "exdone": {
      const ex = JSON.parse(JSON.stringify(rec.ex||{})); ex[v] = Object.assign({}, ex[v], {done:!ex[v]?.done});
      popKey = `${s}:ex:${v}`;
      const sess = planned(s), r = ROUT[sess?.rt], all = r && r.ex.every(e => ex[e.id]?.done);
      const patch = {ex}; if (all && !rec.st) patch.st = "hecha";
      setDayUndo(s, patch, patch.st ? "Rutina completa ✓" : ex[v].done ? "Ejercicio listo" : "Ejercicio desmarcado"); break;
    }
    case "chk": { const h = Object.assign({}, rec.h); h[v] = !h[v]; popKey = `${s}:chk:${v}`; setDayUndo(s, {h}, `${HAB[v].l}: ${h[v]?"listo":"desmarcado"}`); break; }
    case "add": {
      const n = Object.assign({}, rec.n); n[v] = Math.max(0, (n[v]||0) + +b.dataset.n);
      setDayUndo(s, {n}, v==="agua" ? `Agua: ${lt(n.agua)} L` : `Proteína: ${n.prot} g`);
      refreshHab(b.closest(".habcard"), s); return;
    }
    case "meal": {
      const m = meals()[+v]; if (!m) return;
      const n = Object.assign({}, rec.n), log = [...(rec.log||[]), {name:m.name, kcal:m.kcal, prot:m.prot}];
      n.kcal = (n.kcal||0) + (m.kcal||0); n.prot = (n.prot||0) + (m.prot||0);
      setDayUndo(s, {n, log}, `${m.name}: +${nf(m.kcal)} kcal, +${nf(m.prot)} g`); break;
    }
    case "unmeal": {
      const log = [...(rec.log||[])], m = log.splice(+v,1)[0]; if (!m) return;
      const n = Object.assign({}, rec.n); n.kcal = Math.max(0,(n.kcal||0)-(m.kcal||0)); n.prot = Math.max(0,(n.prot||0)-(m.prot||0));
      setDayUndo(s, {n, log}, `${m.name} quitado`); break;
    }
    case "mealadd": {
      const name = $("#mlN").value.trim(), kc = Math.round(+$("#mlK").value||0), pr = Math.round(+$("#mlP").value||0);
      if (!name || (!kc && !pr)) return toast("Escribe el nombre y al menos las calorías o la proteína.");
      S.cfg.meals = {list:[...meals(), {name, kcal:kc, prot:pr}]}; save("cfg","meals"); toast(`${name} agregada`); break;
    }
    case "mealdel": {
      const prev = meals(), list = prev.filter((_,i)=>i!==+v);
      S.cfg.meals = {list}; save("cfg","meals");
      toast("Comida borrada", () => { S.cfg.meals = {list:prev}; save("cfg","meals"); rerender(true); }); break;
    }
    case "wkclose": { const w = b.closest("[data-w]").dataset.w; S.weeks[w] = Object.assign({}, S.weeks[w], {done:true}); save("weeks", w); toast("Semana cerrada"); break; }
    case "wsave": {
      const d = $("#wDate").value, x = num($("#wKg").value), err = $("#wErr");
      if (!d || x==null || x<40 || x>200){ err.hidden = false; err.textContent = "Escribe un peso válido, por ejemplo 95,8."; return; }
      S.weights[d] = {kg:x}; save("weights", d); toast(`Peso guardado: ${kg(x)} kg`); break;
    }
    case "wdel": { const prev = S.weights[v]; S.weights[v] = null; save("weights", v); delete S.weights[v]; persistLocal();
      toast("Pesaje borrado", () => { S.weights[v] = prev; save("weights", v); rerender(true); }); break; }
    case "msave": {
      const d = $("#mDate").value, r = {};
      MF.forEach(([k]) => { const x = num($("#m-"+k).value); if (x!=null) r[k] = x; });
      if (!d || !Object.keys(r).length) return toast("Completa al menos una medida.");
      S.meds[d] = Object.assign({}, S.meds[d], r); save("meds", d); toast("Medidas guardadas"); break;
    }
    case "mdel": { const prev = S.meds[v]; S.meds[v] = null; save("meds", v); delete S.meds[v]; persistLocal();
      toast("Medición borrada", () => { S.meds[v] = prev; save("meds", v); rerender(true); }); break; }
    case "csv": return saveFile(`flyfit-jorge-${today()}.csv`, buildCsv(), "text/csv");
    case "bkexp": return saveFile(`flyfit-respaldo-${today()}.json`, JSON.stringify({app:"flyfit", v:1, at:new Date().toISOString(), data:S}), "application/json");
    default: return;
  }
  rerender(true);
});
document.addEventListener("input", e => {
  const el = e.target, a = el.dataset.act; if (!a) return;
  const s = el.closest("[data-d]")?.dataset.d;
  if (a==="note"){ setDay(s, {note:el.value}); noteSaved(el); }
  if (a==="min"){ const m = el.value==="" ? null : Math.max(0, Math.round(+el.value)); setDay(s, {min:m}); const card = el.closest(".fblock"); card?.querySelectorAll(".dchip").forEach(x => x.setAttribute("aria-pressed", false)); const o = card?.querySelector("[data-durout]"); if (o) o.textContent = m ? `${m} min` : "–"; }
  if (a==="n"){
    const n = Object.assign({}, getDay(s).n), k = el.dataset.v;
    if (el.value==="") delete n[k]; else n[k] = Math.max(0, Math.round(+el.value));
    setDay(s, {n}); refreshHab(el.closest(".habcard"), s);
  }
  if (a==="slide"){ const n = Object.assign({}, getDay(s).n); n.pasos = +el.value; setDay(s, {n}); refreshHab(el.closest(".habcard"), s); return; }
  if (a==="exkg"){ const ex = JSON.parse(JSON.stringify(getDay(s).ex||{})), k = el.dataset.v; ex[k] = Object.assign({}, ex[k], {kg: el.value.trim()}); setDay(s, {ex}); }
  if (a==="lap"){
    const L = [...(getDay(s).laps||["","","","",""])]; L[+el.dataset.v] = el.value.trim(); setDay(s, {laps:L});
    const tot = L.map(parseT).filter(x=>x!=null), n = el.closest(".routine")?.querySelector("[data-laptot]");
    if (n && tot.length) n.textContent = `Total ${fmtT(tot.reduce((a,b)=>a+b,0))}.`;
  }
  if (a==="wk"){ const w = el.closest("[data-w]").dataset.w; S.weeks[w] = Object.assign({}, S.weeks[w], {txt:el.value}); save("weeks", w); }
});
document.addEventListener("change", e => {
  const el = e.target; if (el.dataset.act!=="ov") return;
  const s = el.closest("[data-d]").dataset.d, base = planned(s).base;
  setDayUndo(s, {ov: el.value===base ? "" : el.value}, `Sesión cambiada a ${SESS[el.value].name.toLowerCase()}`); rerender(true);
});
$("#imp").addEventListener("click", e => { if (e.target.id==="imp") closeImport(); });
/* Cronómetro */
function replaceCrono(s){ document.querySelectorAll(`[data-crono="${s}"]`).forEach(el => el.outerHTML = cronoHtml(s)); }
setInterval(() => {
  document.querySelectorAll("[data-crono]").forEach(el => {
    const s = el.dataset.crono, c = cronoState(s);
    if (!el.classList.contains(c.mode)){ if (c.mode==="ready" && el.classList.contains("rest")) { try { navigator.vibrate?.(200); } catch(e){} toast("Descanso terminado"); } el.outerHTML = cronoHtml(s); return; }
    if (c.mode==="run") el.querySelector("[data-cv]").textContent = fmtT(c.el);
    if (c.mode==="rest") el.querySelector("[data-cv]").textContent = fmtT(Math.ceil(c.left));
  });
}, 250);
/* Arranque */
rebuild(); render(true); showSync();
setInterval(() => { if (R.v==="inicio") render(false); }, 30000);

(async () => {
  try {
    if (!window.claude?.use) return;
    claude.use("sample").then(x => { SAMPLE = x; });
    claude.use("downloads").then(x => { DL = x; if (R.v==="mas") rerender(); });
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    DB = db; BASE = "data/users/"+id;
    let first = true;
    DB.collection(BASE).onSnapshot(snap => {
      if (first){
        first = false;
        const hasLocal = Object.keys(PFX).some(k => Object.keys(S[k]).length);
        if (snap.empty && hasLocal){ for (const k of Object.keys(PFX)) for (const key of Object.keys(S[k])) { PEND[PFX[k]+key] = 1; } persistPend(); flushAll(); showSync(); return; }
        flushAll();
      }
      const next = EMPTY();
      snap.docs.forEach(d => { const [k,key] = splitId(d.id); if (k) next[k][key] = d.data(); });
      for (const pid of Object.keys(PEND)){ const [k,key] = splitId(pid); if (!k) continue; if (S[k][key]!=null) next[k][key] = S[k][key]; else delete next[k][key]; }
      S = next; persistLocal(); rebuild(); applyTheme(); showSync(); rerender();
    }, () => { syncErr = true; showSync(); });
  } catch(e){ syncErr = true; showSync(); }
})();
</script>
</body>
</html>
